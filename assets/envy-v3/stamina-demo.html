<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>질투 · 스태미나 테스트</title>
  <style>
    :root {
      color-scheme: dark;
      font: 16px/1.5 "Geist", "Malgun Gothic", system-ui, sans-serif;
      color: #e9f1f8;
      background: #0e1622;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 2rem, 66rem); margin: clamp(1rem, 5vw, 3rem) auto; }
    header, footer, .meter-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .75rem;
    }
    h1 { margin: 0; font-size: clamp(1.4rem, 4vw, 2.25rem); letter-spacing: -.04em; }
    .panel { margin: 1rem 0; border: 1px solid #384b60; border-radius: .9rem; overflow: hidden; }
    .hud {
      background: #162333;
      padding: .85rem 1rem;
      display: grid;
      grid-template-columns: minmax(8rem, 19rem) auto;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .meter-heading { gap: .25rem; font-size: .88rem; }
    output { color: #9de0f4; font-variant-numeric: tabular-nums; }
    progress {
      appearance: none;
      display: block;
      width: 100%;
      height: .45rem;
      border: 0;
      border-radius: 1rem;
      overflow: hidden;
      margin-top: .45rem;
      accent-color: #68cbe8;
      background: #344558;
    }
    progress::-webkit-progress-bar { background: #344558; }
    progress::-webkit-progress-value { background: #68cbe8; }
    progress::-moz-progress-bar { background: #68cbe8; }
    #status { color: #c3deeb; text-align: right; font-size: .9rem; }
    canvas { display: block; width: 100%; height: clamp(17rem, 53vw, 32rem); background: #23364b; }
    button {
      border: 1px solid #456079;
      border-radius: .5rem;
      background: #1c2b3e;
      color: inherit;
      font: inherit;
      padding: .52rem .85rem;
      min-height: 44px;
      cursor: pointer;
    }
    button:hover { background: #2a4058; }
    button:focus-visible { outline: 2px solid #8be5fc; outline-offset: 3px; }
    button:disabled { opacity: .55; cursor: wait; }
    [data-control] { touch-action: none; user-select: none; }
    #sprint { background: #24506a; border-color: #4c8da8; }
    #sprint[aria-pressed="true"] { background: #417892; }
    .controls { display: flex; gap: .45rem; }
    footer p { margin: 0; color: #adbdce; font-size: .85rem; }
    kbd { color: #e9f1f8; font-family: inherit; font-weight: 700; }
    @media (max-width: 420px) {
      main { width: calc(100% - 1.25rem); }
      .hud { gap: .65rem; padding: .7rem .75rem; }
      #status { font-size: .8rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>질투 · 스태미나 테스트</h1>
      <button id="reset" disabled>다시 시작</button>
    </header>
    <section class="panel" aria-label="테스트 화면">
      <div class="hud">
        <div>
          <div class="meter-heading">
            <label for="stamina">스태미나</label>
            <output aria-hidden="true">100%</output>
          </div>
          <progress id="stamina" max="100" value="100"></progress>
        </div>
        <span id="status" role="status">스프라이트 불러오는 중</span>
      </div>
      <canvas aria-label="질투의 걷기, 달리기, 점프, 숙이기, 슬라이딩, 탈진 모션"></canvas>
    </section>
    <footer>
      <div class="controls" role="group" aria-label="화면 조작 버튼">
        <button data-control="left" aria-label="왼쪽으로 걷기" disabled>←</button>
        <button data-control="right" aria-label="오른쪽으로 걷기" disabled>→</button>
        <button id="sprint" aria-pressed="false" disabled>달리기</button>
        <button id="jump" disabled>점프</button>
        <button data-control="crouch" disabled>숙이기</button>
      </div>
      <p><kbd>←</kbd> <kbd>→</kbd> 또는 <kbd>A</kbd> <kbd>D</kbd> 이동 · <kbd>Shift</kbd> 달리기 · <kbd>Space</kbd> 점프 · <kbd>↓</kbd> 숙이기 · 달리는 중 <kbd>↓</kbd> 슬라이딩</p>
    </footer>
  </main>
