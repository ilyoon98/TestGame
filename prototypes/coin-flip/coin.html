<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>동전 뒤집기</title>
<style>
  :root {
    --bg1: #1e2530;
    --bg2: #0e1116;
    --gold1: #ffe9a8;
    --gold2: #d4a437;
    --gold-edge: #8a6a1e;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: radial-gradient(ellipse at center, var(--bg1), var(--bg2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  .scene {
    position: relative;
    width: 320px;
    height: 320px;
    perspective: 900px;
  }

  .table-surface {
    position: absolute;
    left: 50%;
    bottom: 40px;
    width: 180px;
    height: 50px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.45), transparent 70%);
    border-radius: 50%;
    filter: blur(4px);
  }

  .coin-wrap {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 120px;
    height: 120px;
    margin-left: -60px;
    margin-top: -60px;
    transform-style: preserve-3d;
  }

  /* vertical toss (up/down) — separate from the spin so the two can animate independently */
  .tosser {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
  }

  /* the disc that actually spins face-over-face */
  .coin {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transform: rotateY(0deg);
  }

  .coin.flipping {
    animation: spin 1.1s cubic-bezier(.2,.65,.3,1) forwards,
               toss 1.1s cubic-bezier(.3,0,.2,1) forwards;
  }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 800;
    color: #6b4e12;
    background: radial-gradient(circle at 35% 30%, var(--gold1), var(--gold2) 75%);
    box-shadow:
      inset 0 0 0 4px rgba(255,255,255,0.35),
      inset 0 0 0 8px var(--gold-edge),
      0 6px 16px rgba(0,0,0,0.4);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .face.heads { transform: rotateY(0deg) translateZ(1px); }
  .face.tails { transform: rotateY(180deg) translateZ(1px); }

  @keyframes spin {
    0%   { transform: rotateY(0deg); }
    100% { transform: rotateY(var(--spin)); }
  }

  @keyframes toss {
    0%   { top: 0px; }
    35%  { top: -110px; }
    58%  { top: -20px; }
    74%  { top: -60px; }
    88%  { top: -5px; }
    100% { top: 0px; }
  }

  .btn {
    position: absolute;
    bottom: -70px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 28px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(155deg, #ff8a65, #e64a19);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(230,74,25,0.4);
    letter-spacing: 0.02em;
  }
  .btn:active { transform: translateX(-50%) scale(0.96); }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .hint {
    position: absolute;
    bottom: -100px;
    left: 50%;
    transform: translateX(-50%);
    color: #778;
    font-size: 12.5px;
    white-space: nowrap;
  }

  .result {
    position: absolute;
    top: -50px;
    left: 50%;
    transform: translateX(-50%);
    color: #eee;
    font-size: 15px;
    opacity: 0;
    transition: opacity 0.4s ease 0.3s;
  }
  .result.show { opacity: 1; }
</style>
</head>
<body>

<div class="scene">
  <div class="table-surface"></div>
  <div class="result" id="result">Space를 눌러 동전을 던져보세요</div>
  <div class="coin-wrap">
    <div class="tosser" id="tosser">
      <div class="coin" id="coin">
        <div class="face heads">앞</div>
        <div class="face tails">뒤</div>
      </div>
    </div>
  </div>
  <button class="btn" id="flipBtn">동전 던지기</button>
  <div class="hint">Space 키로도 던질 수 있어요</div>
</div>

<script>
  const coin = document.getElementById('coin');
  const btn = document.getElementById('flipBtn');
  const result = document.getElementById('result');
  let flipping = false;

  function flipCoin() {
    if (flipping) return;
    flipping = true;
    btn.disabled = true;
    result.classList.remove('show');

    const isHeads = Math.random() < 0.5;
    const targetY = isHeads ? 0 : 180;

    // extra full spins on top of the target orientation, for a proper flip
    const extraSpins = 360 * (3 + Math.floor(Math.random() * 3));
    const spinY = extraSpins + targetY;

    coin.style.setProperty('--spin', spinY + 'deg');

    coin.classList.remove('flipping');
    void coin.offsetWidth; // restart animation
    coin.classList.add('flipping');

    coin.addEventListener('animationend', function onEnd() {
      coin.removeEventListener('animationend', onEnd);
      // snap to the exact clean resting transform (no leftover spin degrees)
      coin.style.animation = 'none';
      coin.style.transform = `rotateY(${targetY}deg)`;
      result.textContent = '결과: ' + (isHeads ? '앞면' : '뒷면');
      result.classList.add('show');
      flipping = false;
      btn.disabled = false;
    }, { once: true });
  }

  btn.addEventListener('click', flipCoin);

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault(); // stop the page from scrolling / re-clicking a focused button
      if (!e.repeat) flipCoin();
    }
  });
</script>

</body>
</html>
