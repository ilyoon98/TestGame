<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101713">
<link rel="preload" as="image" href="art/characters/nun-sd.png">
<link rel="preload" as="image" href="art/characters/guard-sd.png">
<link rel="preload" as="image" href="art/characters/awakened-sd.png">
<title>붕괴 통로 · 기술 자동 전투</title>
<style>
  :root{color-scheme:dark;--bg:#101713;--plate:#17211b;--well:#111a15;--edge:#334137;--ink:#f1ead9;--soft:#bdc9b9;--lime:#d4ec94;--rust:#ffc09f;--blue:#a6d9f0;--warn:#f2aa73;--loss:#ff9d91}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 28% 0,#253128 0,transparent 60%),var(--bg);color:var(--ink);font:15px/1.5 "Atkinson Hyperlegible Next","Malgun Gothic",system-ui,sans-serif}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,summary:focus-visible{outline:2px solid white;outline-offset:3px}
  button:disabled{cursor:default}
  button:not(:disabled):hover{filter:brightness(1.13)}
  .frame{width:min(1190px,100%);margin:auto;padding:24px 30px}
  header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:17px}
  h1,h2,h3,p{margin:0}
  h1{font-size:clamp(28px,4.5vw,49px);line-height:1.12;letter-spacing:-.075em}
  h2{font-size:22px;letter-spacing:-.045em}
  h3{font-size:15px}
  small,.muted{color:var(--soft)}
  .place{display:flex;align-items:center;gap:8px;color:var(--lime);font-size:13px;margin-top:5px}
  .place::before{content:"";width:6px;height:6px;background:currentColor;rotate:45deg}
  .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .qa-tools:not([hidden]){display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;padding:7px 9px;background:#2b2118;border:1px solid #8d6344;border-radius:5px;color:var(--warn);font-size:12px}
  .qa-tools .btn{padding:4px 7px;font-size:12px}
  .qa-tools .btn:disabled{opacity:.5}
  .qa-summary{color:var(--warn);font-weight:700}
  .btn{border:1px solid var(--edge);background:#253228;padding:8px 12px;border-radius:7px;white-space:nowrap}
  .primary{background:var(--lime);color:#172015;border-color:var(--lime);font-weight:800}
  .danger{color:var(--loss)}
  .status{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:10px;margin-bottom:12px}
  .status-box,.panel,.hand,.routes,.journal,details{background:var(--plate);border:1px solid var(--edge);border-radius:10px}
  .status-box{padding:11px 14px;display:flex;align-items:center;gap:13px}
  .status-box strong{font-size:24px;line-height:1;color:var(--lime);font-variant-numeric:tabular-nums}
  .status-box.urgent strong{color:var(--loss)}
  .status-box p{font-size:13px}
  .status-box small{display:block;font-size:12px}
  .meter{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto;max-width:115px;justify-content:flex-end}
  .meter i{width:8px;height:13px;border-radius:2px;background:var(--lime)}
  .urgent .meter i{background:var(--loss)}
  .health{font-variant-numeric:tabular-nums}
  .health-bar{display:block;height:4px;min-width:55px;border-radius:3px;background:#39413b;margin-top:4px;overflow:hidden}
  .health-bar i{display:block;height:100%;width:var(--life);background:var(--rust)}
  .status-box.health .health-bar{flex:1;min-width:25px;margin:0}
  .foe-health{text-align:right;color:var(--rust);font-size:13px}
  .combat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .panel{padding:13px}
  .panel-top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:9px}
  .tag{color:var(--soft);font-size:12px;white-space:nowrap}
  .body-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .part{border:1px solid var(--edge);background:var(--well);border-radius:6px;text-align:left;min-width:0;padding:6px 8px;position:relative}
  .part:disabled{opacity:1}
  .part.available{border-color:var(--lime);background:#253125}
  .part.marked{outline:2px solid var(--lime);outline-offset:-2px}
  .part.threat{border-color:#aa7053}
  .part.available.threat{border-color:var(--lime)}
  .part-top{display:flex;justify-content:space-between;gap:3px;align-items:center;font-size:13px}
  .part-top small{font-size:10px}
  .part-stats{display:flex;gap:4px;justify-content:space-between;color:var(--soft);font-size:11px;white-space:nowrap;letter-spacing:-.025em}
  .bar{display:block;height:3px;background:#344139;margin:4px 0 3px;border-radius:3px;overflow:hidden}
  .bar>i{display:block;height:100%;width:var(--life);background:var(--lime)}
  .injured .part-top small,.injured .bar>i{color:var(--warn)}
  .injured .bar>i{background:var(--warn)}
  .lost .part-top small{color:var(--loss)}
  .intent{border:1px solid #69493c;background:#28211b;border-radius:7px;margin-top:8px;padding:7px 9px;color:var(--rust);font-size:12px;min-height:35px}
  .intent b{margin-right:7px;color:var(--ink)}
  .panel-note{margin-top:8px;font-size:12px;color:var(--soft);min-height:35px;display:flex;align-items:center}
  .hand{margin-top:10px;padding:12px 13px}
  .hand-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}
  .hand-head h2{font-size:19px}
  .hand-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
  .card{display:flex;flex-direction:column;min-height:116px;text-align:left;padding:8px 9px;border:1px solid var(--edge);border-top:3px solid var(--accent);border-radius:7px;background:var(--well);min-width:0}
  .attack{--accent:var(--rust)} .defense{--accent:var(--blue)} .skill{--accent:var(--lime)}
  .card.selected{background:#2b382a;outline:2px solid var(--accent);outline-offset:-2px}
  .card:disabled{opacity:.68}
  .card-head{display:flex;justify-content:space-between;align-items:center;gap:5px;color:var(--accent);font-size:11px}
  .cost{display:grid;place-items:center;border:1px solid currentColor;border-radius:5px;width:23px;height:23px;font-size:14px;font-weight:900}
  .card strong{font-size:15px;margin-top:3px}
  .card p{font-size:12px;color:var(--soft);line-height:1.35;margin-top:3px}
  .card .card-note{color:var(--accent);margin-top:auto;padding-top:4px}
  .target-hint{font-size:13px;color:var(--lime);min-height:20px;margin-top:8px}
  .routes{padding:18px}
  .routes p{margin-top:4px}
  .trail{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px;color:var(--soft);font-size:12px}
  .route-map{margin-top:14px;padding:8px;background:var(--well);border:1px solid var(--edge);border-radius:8px}
  .map-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding:3px 6px 7px}
  .map-head small{font-size:11px}
  .map-layout{position:relative;isolation:isolate;display:grid;grid-template-columns:repeat(var(--map-stages,5),minmax(0,1fr));grid-template-rows:repeat(3,minmax(57px,auto));align-items:center}
  .map-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1}
  .map-lines line{stroke:#59665b;stroke-width:1.5px;vector-effect:non-scaling-stroke}
  .map-lines line.walked{stroke:var(--lime);stroke-width:2px}
  .map-lines line.traveling{stroke:#f6d693;stroke-width:3px}
  .map-node{grid-column:var(--col);grid-row:var(--row);margin:3px 7px;padding:5px 5px 4px;min-height:47px;display:grid;align-content:center;justify-items:center;text-align:center;line-height:1.3;background:#19251d;border:1px solid #47594a;border-radius:6px}
  .map-node b{font-size:12px}.map-node span{font-size:10px;color:var(--soft)}.map-node .fight-label{color:var(--rust)}
  .map-node:not(.current,.next){border-color:#303c32;background:#171e17}
  .map-node:not(.current,.next)>*{opacity:.5}
  .map-node.current{border-color:#f5d58d;background:#392f20;box-shadow:0 0 0 1px #f5d58d80,0 0 14px #e4b95838}
  .map-node.current b{color:#ffe5ae}
  .map-node.next{border-color:#98c9ab;background:#22382e;padding:7px 5px;gap:2px}
  .map-node.next:is(:hover,:focus-visible){border-color:var(--lime);background:#2e4839}
  .map-node.visited{border-style:dashed}
  .map-node.next b,.map-node .map-margin{color:var(--lime)}
  .map-node .map-margin,.map-node .map-threat{font-size:11px}
  .map-node .map-threat{color:var(--rust)}
  .map-node.traveling{border-color:#f6d693;box-shadow:0 0 16px #ecd18b55}
  .map-traveler{position:absolute;z-index:2;left:var(--from-x);top:var(--from-y);display:grid;place-items:center;width:29px;height:29px;border:1px solid #f6d693;border-radius:50%;background:#302a1b;color:#f6d693;box-shadow:0 0 11px #f6d69377;pointer-events:none}
  .map-traveler svg{width:21px;height:21px}
  .map-settings{margin-bottom:8px;padding:6px 10px;border-radius:4px}
  .map-settings form{display:flex;align-items:end;flex-wrap:wrap;gap:8px;margin-top:8px}
  .map-settings label{display:grid;gap:3px;color:var(--soft);font-size:12px}
  .map-settings input{max-width:100%;padding:6px;background:var(--well);border:1px solid var(--edge);border-radius:4px;color:var(--ink);font:inherit}
  .map-settings input[type=number]{width:56px}.map-settings input[name=widths]{width:94px}
  .map-settings [role=alert]:not(:empty){color:var(--loss);font-size:12px;margin-top:4px}
  .treatment{display:grid;gap:7px;margin-top:13px;padding:10px;border:1px solid #537769;background:#1c3028;border-radius:6px}
  .treatment p{font-size:13px;margin:0;color:var(--soft)}
  .treatment-options{display:flex;gap:5px;flex-wrap:wrap}
  .treatment-options .btn{color:var(--lime);font-size:12px}
  .lower{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .journal,details{padding:9px 12px;font-size:12px}
  .journal h2{font-size:14px}
  .journal ol{list-style:none;margin:4px 0 0;padding:0;color:var(--soft);max-height:90px;overflow:auto}
  summary{cursor:pointer;font-size:13px;font-weight:700}
  details p{margin-top:6px;color:var(--soft)}
  .reference{display:grid;gap:4px;margin-top:8px}
  .reference div{border-top:1px solid var(--edge);padding-top:4px}
  @media(max-width:820px){.hand-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.frame{padding:18px}}
  @media(max-width:580px){
    .frame{padding:11px 9px}header{margin-bottom:10px;gap:5px}.status{grid-template-columns:1fr 1fr}.status-box{padding:8px;gap:6px}.status-box small{font-size:10px}.status-box strong{font-size:21px}.meter{display:none}
    .status-box.health{grid-column:1/-1}.status-box.health .health-bar{flex:1;margin:0 4px 0 8px}
    .panel{padding:7px}.panel-top{gap:3px;flex-wrap:wrap;margin-bottom:4px}.panel-top h2{font-size:16px}.tag{font-size:10px}
    .body-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:3px}.part{padding:3px 4px}.part-top{font-size:12px}.part-top small,.part-stats{font-size:9px}
    .intent,.panel-note{font-size:10px;min-height:30px;padding:4px;margin-top:3px}.hand{padding:8px}.hand-head{margin-bottom:5px}
    .hand-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.card{min-height:96px}.lower{grid-template-columns:1fr}
    .routes{padding:10px}.map-head{gap:5px;flex-wrap:wrap}.map-layout{--map-choice-scale:1.03;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(var(--map-stages,5),minmax(49px,auto))}
    .map-node{grid-column:var(--row);grid-row:var(--col);margin:3px 2px;padding:4px 2px}
  }
  @media(prefers-reduced-motion:no-preference){
    .part,.card,.btn,.map-node{transition:filter .12s,background .12s,border-color .12s}
    .map-layout:not(:has(.map-node.traveling)) .map-node.next:not(:hover,:focus-visible){animation:map-choice-pulse 2.4s ease-in-out infinite}
    @keyframes map-choice-pulse{0%,100%{transform:scale(1)}50%{transform:scale(var(--map-choice-scale,1.04))}}
  }

  /* Victory spoils use the same worn paper as the hand, laid flat for comparison. */
  .reward-panel{padding:clamp(16px,3vw,30px);border:1px solid #8e7755;border-radius:6px;background:#211f18}
  .reward-heading{display:flex;justify-content:space-between;align-items:start;gap:16px}
  .reward-kicker{color:var(--warn);font-size:12px;letter-spacing:.08em;margin-bottom:5px}
  .reward-heading p,.reward-footer p{font-size:13px;color:var(--soft);margin-top:5px}
  .reward-heading h2{font-size:clamp(23px,4vw,32px)}
  .reward-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:22px auto;max-width:790px}
  .reward-grid .card{width:100%;min-height:260px;transform:none;cursor:pointer;touch-action:manipulation;padding:12px;text-align:left}
  .reward-grid .card-art{height:95px;margin:8px 0}
  .reward-grid .card strong{font-size:20px}.reward-grid .card p{font-size:13px;line-height:1.5}
  .reward-grid .card .card-note{font-size:12px;padding-top:10px}
  .reward-pick{display:block;text-align:center;margin-top:14px;padding:7px;background:#332d21;color:#fff0cc;border-radius:3px;font-size:13px;font-weight:700}
  .reward-grid .card:hover,.reward-grid .card:focus-visible{transform:translateY(-4px);outline:2px solid var(--warn);outline-offset:3px}
  .reward-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--edge);padding-top:14px}
  .run-deck{margin-top:10px}.run-deck>p{font-size:12px}
  .deck-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:7px;margin-top:10px}
  .deck-entry{padding:8px 10px;background:var(--well);border-left:3px solid var(--accent)}
  .deck-entry.acquired{background:#253027}.deck-entry strong{font-size:13px}.deck-entry small{display:block;margin-top:3px}
  .deck-entry .deck-count{float:right;color:var(--warn)}
  .auto-badge{color:var(--lime);font-size:12px;padding:4px 8px;border:1px solid var(--edge);border-radius:4px;background:var(--well)}
  .hand.watch-only .card:disabled{opacity:1;cursor:default;touch-action:auto}
  .hand.watch-only .card.unavailable:disabled{opacity:.5}
  @media(max-width:580px){
    .reward-grid{grid-template-columns:1fr;gap:10px;margin:16px 0}
    .reward-grid .card{display:grid;grid-template-columns:72px minmax(0,1fr);column-gap:12px;min-height:160px;padding:10px}
    .reward-grid .card-art{grid-column:1;grid-row:1/5;height:100%;min-height:100px;margin:0}
    .reward-grid .card-head,.reward-grid .card strong,.reward-grid .card p,.reward-grid .reward-pick{grid-column:2}
    .reward-grid .card strong{font-size:17px}.reward-pick{margin-top:8px;padding:5px}
    .reward-heading,.reward-footer{flex-wrap:wrap}.reward-footer .btn{width:100%}
  }

  /* The steel stage, field labels and worn cards share the artwork palette. */
  :root{--bg:#101310;--plate:#1b1e18;--well:#141811;--edge:#454438;--ink:#f6ecda;--soft:#c6c1ad;--lime:#a9e2c8;--rust:#ffb793;--blue:#b2deed;--warn:#f2c27e;--loss:#ff9e8a}
  body{background:linear-gradient(110deg,#1c231e 0%,#101310 56%);font-family:"Atkinson Hyperlegible Next","Malgun Gothic",system-ui,sans-serif}
  .frame{width:min(1310px,100%);padding:16px 24px}
  header{margin-bottom:12px}h1{font-family:"Bricolage Grotesque","Malgun Gothic",system-ui,sans-serif;font-size:clamp(26px,4vw,42px);letter-spacing:-.09em}
  .place{color:var(--warn);margin-top:3px}
  .status{gap:7px;margin-bottom:8px}.status-box{padding:8px 12px;background:#1d221c;border-radius:4px}
  .status-box strong{font-size:21px}.status-box.health strong{color:var(--rust)}
  .status-box p{font-size:12px}.status-box small{font-size:11px}
  .status-box.pursuit{display:grid;grid-template-columns:auto auto minmax(72px,1fr);gap:8px}
  .pursuit-track{position:relative;margin-left:5px;min-width:0;height:31px;color:var(--rust)}
  .pursuit-track::before{content:"";position:absolute;left:3%;right:8%;top:50%;border-top:2px dashed #9a847d}
  .pursuit-track .pursuer,.pursuit-track .runner{position:absolute;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;border-radius:4px;background:#261d17}
  .pursuit-track .pursuer{left:var(--near);z-index:1;min-width:25px;height:24px;padding:2px;border:1px solid #835a48;color:#ffc495}
  .pursuit-track .runner{left:94%;width:22px;height:22px;border:1px solid #608c7c;background:#192d27;color:var(--lime)}
  .pursuit-track svg{width:19px;height:19px}
  .urgent .pursuit-track .pursuer{color:var(--loss);border-color:var(--loss);box-shadow:0 0 12px #b649367f}
  .sound-toggle[aria-pressed=true]{color:var(--lime)}
  .stage-combat{position:relative;isolation:isolate;border:1px solid #595242;border-radius:5px;overflow:hidden;background:center/cover var(--art-arena) #242922}
  .stage-combat::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#11170ed9 0%,transparent 24%,transparent 77%,#0d120edc 100%)}
  .combat{height:clamp(314px,43vh,408px);gap:0}
  .combat-field{position:relative;isolation:isolate}
  .combat .panel{position:relative;z-index:1;isolation:isolate;padding:0;border:0;border-radius:0;background:none;min-width:0}
  .actor-player{grid-column:1;grid-row:1;--accent:var(--lime)}
  .actor-enemy{grid-column:2;grid-row:1;--accent:var(--rust)}
  .actor-caption{position:absolute;z-index:2;top:9px;left:13px;right:13px;display:flex;align-items:flex-start;justify-content:space-between;gap:5px}
  .actor-caption h2{color:var(--accent);font-size:clamp(15px,2vw,23px);text-shadow:0 2px 4px black}
  .actor-caption .tag{font-size:11px}
  .actor-enemy .actor-caption{flex-direction:row-reverse;justify-content:flex-start;text-align:right}
  .combat .foe-health{position:absolute;z-index:3;left:50%;bottom:29px;transform:translateX(-50%);width:min(calc(100% - 12px),234px);display:grid;align-items:center;border:1px solid #776454;border-radius:4px;background:#231e18;color:#fff3e2;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
  .foe-health .health-bar,.foe-health .hp-value{grid-area:1/1}
  .foe-health .health-bar{height:17px;min-width:0;margin:0;background:#2e2923}
  .foe-health .health-bar i{background:#4b9278}
  .companion-actor .health-bar i{background:#8062a1}
  .actor-enemy .health-bar i{background:#a95843}
  .foe-health .hp-value{position:relative;font-size:12px;text-shadow:0 1px 2px #000}
  @media(min-width:581px){.status:not(:has(.health)){grid-template-columns:1.25fr 1fr}}
  .actor-figure{position:absolute;top:clamp(40px,6vh,56px);bottom:24px;left:53%;transform:translateX(-50%);width:min(100%,370px)}
  .actor-enemy .actor-figure{left:47%}
  .actor-sprite{position:absolute;inset:0;background:bottom center/contain no-repeat var(--portrait);filter:drop-shadow(0 8px 6px #0c0e0bd9)}
  .body-grid.hotspots{position:absolute;inset:0;display:block}
  .hotspots .part{position:absolute;z-index:1;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:58px;height:36px;padding:2px 4px;border:1px solid #b0ac8b;background:#141914e8;border-radius:4px;box-shadow:0 2px 5px #0009;color:var(--ink);text-align:center}
  .hotspots .part-top{justify-content:center;gap:3px;font-size:12px;line-height:13px;white-space:nowrap}
  .hotspots .part-top small{font-size:9px;line-height:10px}
  .hotspots .part-stats{justify-content:center;gap:3px;font-size:9px;line-height:10px}
  .hotspots .bar{height:3px;margin:2px 0 1px}
  .hotspots .part.injured{border-color:var(--warn)}
  .hotspots .part.lost{border-color:#ac6c60;background:#38231fef}
  .hotspots .part.threat{border:2px solid var(--rust);box-shadow:0 0 0 2px #572c21,0 0 15px #e676487d}
  .hotspots .part.available{z-index:2;border:2px dashed var(--lime);background:#10352a;box-shadow:0 0 0 2px #14221b,0 0 13px #b3f6d46e}
  .hotspots .part.available.threat{border-color:var(--lime)}
  .hotspots .part.guarded:not(.available):not(.threat){border-color:#a6e3f8;background:#142b32f5}
  .hotspots .part.guard-intent:not(.guarded):not(.available):not(.threat){border-color:#a6e3f8;border-style:dashed}
  .part-guard{display:inline-flex;align-items:center;gap:1px;padding:0 2px;border-radius:2px;background:#185068;color:#e1f7ff;font-size:11px;font-weight:800;line-height:11px}
  .part-guard svg{width:9px;height:9px;flex:none}
  .part-guard .guard-upcoming{color:#b6e7f9}

<main class="frame">
  <header><div><h1>붕괴 통로</h1><p class="place" id="location"></p></div>
    <div class="actions"><button type="button" class="btn sound-toggle" id="sound" data-action="sound" aria-pressed="true">효과음 켬</button>
      <button type="button" class="btn" id="auto-pause" data-action="auto-pause" aria-pressed="false" aria-keyshortcuts="Space">전투 일시정지</button>
      <button type="button" class="btn" id="auto-speed" data-action="auto-speed">배속 1×</button>
      <button type="button" class="btn" id="restart" data-action="restart">다시 시작</button></div></header>
  <details class="map-settings" id="map-settings"><summary>지도 설정</summary>
    <form id="map-form">
      <label>시드<input name="seed" maxlength="24" size="13" placeholder="무작위" autocomplete="off"></label>
      <label>구간별 방 수<input name="widths" value="3,3" maxlength="12" required></label>
      <label>상점<input name="shops" type="number" min="0" max="12" value="1" required></label>
      <label>휴게소<input name="rests" type="number" min="0" max="12" value="1" required></label>
      <label>엘리트<input name="elites" type="number" min="0" max="12" value="1" required></label>
      <label>? 방<input name="mysteries" type="number" min="0" max="12" value="1" required></label>
      <button type="submit" class="btn primary">시드로 시작</button>
      <button type="button" class="btn" data-action="classic-map">기본 지도</button>
    </form><p id="map-error" role="alert"></p>
  </details>
  <section class="status" id="status" aria-label="전투 및 추격 상태"></section>
  <section class="qa-tools" id="qa-tools" aria-label="QA 도구" hidden>
    <b>QA · F8</b>
    <button type="button" class="btn" data-action="qa" data-value="win" aria-keyshortcuts="K">전투 승리 (K)</button>
    <button type="button" class="btn" data-action="qa" data-value="heal" aria-keyshortcuts="H">아군 완전 회복 (H)</button>
    <button type="button" class="btn" data-action="qa" data-value="margin" aria-keyshortcuts="J">도망 여유 +5 (J)</button>
  </section>
  <p class="pursuit-announcement" id="pursuit-announcement" role="status"></p>
  <p class="combat-announcement" id="combat-announcement" role="status"></p>
  <section id="stage" aria-label="현재 구역"></section>
  <div class="lower">
    <section class="journal"><h2>행동 기록</h2><ol id="log" aria-live="polite" aria-relevant="additions"></ol></section>
    <details id="help"><summary>전투 규칙</summary>
      <p>전투 전에 기술 아이콘을 눌러 3개를 장착하세요. 충전된 기술은 자동으로 발동해요. 동료 기술도 장착할 수 있어요.</p>
      <p>전투 시간 3초마다 도망 여유가 1 줄어요. 일시정지와 행동 연출 중에는 충전과 추격이 멈춰요.</p>
      <p>보상은 1–3으로 고르고 0으로 건너뛰어요. 새 기술은 전투 준비에서 장착하고, 강화하면 쿨타임이 줄어요.</p>
      <p>결손된 부위를 쓰는 기술은 잠겨요. 가드는 상대의 다음 공격까지 유지돼요.</p>
    </details>
  </div>

function mapRandom(seed){
  let state=2166136261;
  for(const letter of seed) state=Math.imul(state^letter.codePointAt(0),16777619);
  return ()=>{
    state=(state+0x6D2B79F5)|0;
    let value=Math.imul(state^(state>>>15),state|1);
    value^=value+Math.imul(value^(value>>>7),value|61);
    return ((value^(value>>>14))>>>0)/4294967296;
  };
}

function generateMap({seed,widths,shops,rests,elites,mysteries=0}){
  const random=mapRandom(seed);
  const total=widths.reduce((sum,width)=>sum+width,0);
  const pool=shuffle([
    ...Array(shops).fill("shop"),...Array(rests).fill("rest"),...Array(elites).fill("elite"),
    ...Array(mysteries).fill("mystery"),...Array(total-shops-rests-elites-mysteries).fill("battle")
  ],random);
  const map={threshold:{...standardAreas.threshold,next:[]}};
  const battleRooms=[{name:"환기 통로",foe:"crawler"},{name:"의무실",foe:"medic"},{name:"계단참",foe:"sentinel"}];
  const specialRooms={shop:{name:"암시장"},rest:{name:"휴게소"},elite:{name:"독방",foe:"sentinel"},mystery:{name:"?"}};
  const eventIds=Object.keys(mysteryEvents);
  const stages=[["threshold"],...widths.map((width,stage)=>{
    const rows=width===1?[2]:shuffle([1,2,3],random).slice(0,width).sort((a,b)=>a-b);
    return rows.map(row=>{
      const type=pool.pop();
      const room=type==="battle"?battleRooms[Math.floor(random()*battleRooms.length)]:specialRooms[type];
      const id=`room-${stage+1}-${row}`;
      map[id]={...room,type,col:stage+2,row,next:[]};
      if(type==="mystery") map[id].event=eventIds[Math.floor(random()*eventIds.length)];
      if(room.foe==="medic") map[id].companions=standardAreas.infirmary.companions;
      if(room.foe==="crawler" || room.foe==="sentinel") map[id].companion="archer";
      return id;
    });
  }),["lift"],["exit"]];
  map.lift={...standardAreas.lift,type:"boss",col:stages.length-1,next:[]};
  map.exit={...standardAreas.exit,col:stages.length,next:[]};
  // Walk each ordered layer together so every room is connected and edges do not cross.
  for(let stage=0;stage<stages.length-1;stage++){
    const from=stages[stage],to=stages[stage+1];
    let left=0,right=0;
    while(true){
      map[from[left]].next.push(to[right]);
      const lastLeft=left===from.length-1,lastRight=right===to.length-1;
      if(lastLeft && lastRight) break;
      const choice=random();
      if(!lastLeft && (lastRight || choice<.67)) left++;
      if(!lastRight && (lastLeft || choice>.33)) right++;
    }
  }
  return map;
}

function condition(fighter, id){
  const {hp,max} = fighter.body[id];
  if(hp === 0) return "lost";
  return hp * 2 <= max ? "injured" : "healthy";
}

function travelGain(legs=condition(game.player,"legs")){

function power(card, actor){
  return card.power + (card.part && condition(actor,card.part)==="healthy" ? card.bonus : 0);
}

function healValue(actor,amount=2){

}

function healPart(actor,target,amount){
  const part=actor.body[target];
  const recovered=Math.min(part.max-part.hp,amount);
  part.hp+=recovered;
  actor.hp=Math.min(actor.maxHp,actor.hp+recovered);
  return recovered;
}

function shuffle(items,random=Math.random){
  const result = [...items];
  for(let i=result.length-1;i>0;i--){
    const j = Math.floor(random()*(i+1));
    [result[i],result[j]] = [result[j],result[i]];
  }
  return result;
}

  const actor=state[side];
  return Object.entries(cards).filter(([id,card])=>{
    if(card.character && card.character!==actor.kind) return false;
    if(card.weapon && card.weapon!==actor.weapon) return false;
    return state.skillLevels[id] || card.character || card.weapon;
  }).map(([id])=>id);
}

  if(game.phase!=="prep" || !availableSkills(side).includes(id)) return false;
  const loadout=sideLoadout(side);
  const equipped=loadout.indexOf(id);
  if(equipped>=0){
    loadout[equipped]=null;
    return true;
  }
  const empty=loadout.indexOf(null);
  if(empty<0 || equippedBy(id)) return false;
  loadout[empty]=id;
  return true;
}

  if(game.phase!=="prep" || !loadoutsReady()) return false;
  const sides=partySides();
  for(const side of sides) clearDefense(game[side]);
  autoPaused=false;
  game.phase="combat";
  const skills=sides.flatMap(side=>sideLoadout(side).map(id=>{
    const cooldown=skillCooldown(id);
    return {id,side,cooldown,readyAt:cooldown};
  }));
  const counts=countTraits(sides.map(side=>game[side]));
  const activeTraits=game.synergiesEnabled?[...counts].filter(([id,count])=>traits[id].effect && count>=traitThreshold).map(([id])=>id):[];
  game.cooldownBattle={elapsed:0,skills,traits:new Set(activeTraits),usedTraits:new Set(),
    enemySkills:game.foe.patterns.flat(),enemyIndex:0,enemyReadyAt:battleTiming.enemyInterval};
  return true;
}

function timedEnemyPlan(){
  const battle=game.cooldownBattle;
  const [id,target,second]=battle.enemySkills[battle.enemyIndex];
  if(id==="aid"){
    const wound=healValue(game.enemy)?weakest(game.enemy,woundedParts(game.enemy).map(([part])=>part)):null;
    return wound?{id:"aid",targets:[wound]}:{id:"guard",targets:["head"]};
  }
  return {id,side:enemyAttackSide(id),targets:second?[target,second]:[target]};
}

function weakest(actor, permitted){
  return [...permitted].sort((a,b)=>{
    const x=actor.body[a], y=actor.body[b];
    return x.hp+x.guard-(y.hp+y.guard);
  })[0];
}

function attackTarget(target,active){
  if(active.includes(target)) return target;
  return active.includes("chest")?"chest":"head";
}

function intactParts(actor){
  return Object.keys(parts).filter(id=>actor.body[id].hp>0);
}

function enemyAttackSide(id,state=game){
  const sides=partySides(state);
  return (id==="aim"?sides.at(-1):sides[0]) || "player";
}

function resolveIntent(action,state=game){
  const card=cards[action.id];
  const actor=state.enemy;
  if(action.id==="aid"){
    const {hp,max}=actor.body[action.targets[0]];
    if(!healValue(actor) || !hp || hp===max) return null;
  }
  let id=action.id;
  let targets=[...action.targets];
  if(card.part && condition(actor,card.part)==="lost"){
    id=card.type==="attack"?"strike":card.type==="defense"?"guard":null;
    if(!id) return null;
    targets=targets.slice(0,1);
  }
  if(cards[id].type==="defense"){
    targets=targets.filter(target=>condition(actor,target)!=="lost");
    if(id==="split" && targets.length===1) id="guard";
    if(!targets.length) return null;
  }
  if(cards[id].type==="attack"){
    const side=partySides(state).includes(action.side)?action.side:enemyAttackSide(id,state);
    return {id,side,targets:[attackTarget(targets[0],intactParts(state[side]))]};
  }
  return {id,targets};
}

function queueFeedback(event,state){
  state.feedback.push({...event,intent:state.enemyAction});
}

function hit(attacker, defender, target, damage, {id,pierce=0,removed=0,bonusDamage=0},state){
  const part=defender.body[target];
  if(!part.hp || isDown(defender)) return;
  const before=condition(defender,target);
  const effectiveGuard=Math.max(0,part.guard-pierce);
  const from=sideOf(attacker,state);
  const prisoner=removed && attacker.factions?.includes("prisoner")?useTrait("prisoner",state):0;
  const warrior=before==="injured" && cards[id].type==="attack" && damage+prisoner>=effectiveGuard &&
    attacker.jobs?.includes("warrior")?useTrait("warrior",state,`warrior:${from}`):0;
  damage+=prisoner+warrior;
  const blocked=Math.min(damage,effectiveGuard);
  part.guard-=blocked;
  const dealt=Math.min(part.hp,damage-blocked);
  const critical=bonusDamage>0?dealt-Math.min(part.hp,Math.max(0,damage-bonusDamage-effectiveGuard)):0;
  part.hp-=dealt;
  defender.hp=Math.max(0,defender.hp-dealt);
  const side=sideOf(defender,state);
  const defeated=isDown(defender);
  const fallen=companionSides.includes(side) && defeated;
  const after=condition(defender,target);
  const event={type:"hit",card:id,from,side,targets:[target],dealt,blocked,removed,critical,defeated,hp:defender.hp};
  if(prisoner || warrior) event.synergies=[prisoner?"prisoner":null,warrior?"warrior":null].filter(Boolean);
  if(before!==after){
    event.injury=after;
    event.bodyStatus=bodyStatus(defender);
  }
    if(dealt && after!=="healthy") event.wounds=bodyWounds(defender);
  if(side==="player" && target==="legs" && before!==after) event.legChange={before,after};
  queueFeedback(event,state);
  record(`${attacker.name} → ${defender.name} ${parts[target]} · 피해 ${dealt}${blocked?` · 가드 ${blocked}`:""}`,state);
  if(after!==before) record(`${defender.name}의 ${parts[target]} ${labels[after]}`,state);
  if(after==="lost") part.guard=0;
  if(fallen){
    state.deadCompanions=[...state.deadCompanions,defender.kind];
    state.formation[state.formation.indexOf(side)]=null;
    record(`${defender.name}이(가) 쓰러졌어요.`,state);
  }
  if(defender.counter?.target===target && !isDown(defender)){
    const counter=defender.counter;
    defender.counter=null;
    hit(defender,attacker,"chest",counter.damage,{id:"counter",bonusDamage:counter.damage-cards.counter.power},state);
  }
}

function applyCard(id, actor, opponent, targets,state=game,recipient=actor){
  const card=cards[id], amount=power(card,actor);
  const [target]=targets;
  switch(card.effect || id){
    case "strike":
    case "heavy": hit(actor,opponent,target,amount,{id,bonusDamage:amount-card.power},state); break;
    case "aim": hit(actor,opponent,target,2,{id,pierce:amount},state); break;
    case "break":{
      const part=opponent.body[target];
      const removed=Math.min(part.guard,amount);
      part.guard-=removed;
      hit(actor,opponent,target,1,{id,removed},state);
      break;
    }
    case "guard":
    case "split":
    case "counter":{
      const bonus=state.enemy!==actor && state[partySides(state)[0]]===recipient?useTrait("guard",state):0;
      const added=guardAmount(id,actor)+bonus;
      for(const key of targets) recipient.body[key].guard+=added;
      const event={type:"guard",card:id,from:sideOf(actor,state),side:sideOf(recipient,state),targets:[...targets],added};
      if(bonus) event.synergies=["guard"];
      queueFeedback(event,state);
      if(id==="counter") recipient.counter={target,damage:amount};
      record(`${recipient.name} · ${targets.map(key=>parts[key]).join("·")}에 ${card.name}`,state);
      break;
    }
    case "aid":{
      const before=condition(recipient,target);
      const healing=healValue(recipient,amount);
      const part=recipient.body[target];
      const bonus=healing && part.hp>0 && part.hp<part.max && actor.jobs?.includes("mage")?useTrait("mage",state):0;
      const recovered=healPart(recipient,target,healing+bonus);
      const after=condition(recipient,target);
      const restored=before!==after;
      const event={type:"heal",card:id,from:sideOf(actor,state),side:sideOf(recipient,state),targets:[target],recovered,restored,hp:recipient.hp};
      if(bonus) event.synergies=["mage"];
      if(restored) event.bodyStatus=bodyStatus(recipient);
      if(restored || (recovered && after!=="healthy")) event.wounds=bodyWounds(recipient);
      queueFeedback(event,state);
      record(`${recipient.name} · ${parts[target]} 내구도 +${recovered}${restored?" · 정상 회복":""}`,state);
      break;
    }
  }
}

function quickHealTarget(){
  let best=null;
  for(const side of partySides()){
    const actor=game[side];
    if(!healValue(actor)) continue;
    for(const [target,part] of woundedParts(actor)){
      const missing=part.max-part.hp;
      if(!best || missing>best.missing) best={side,target,missing};
    }
  }
  return best;
}

function skillBlocked({id,side}){
  const {part,ranks}=cards[id];
  const actor=game[side];
  if(!actor || isDown(actor)) return "동료 이탈";
  const rank=game.formation.indexOf(side);
  if(ranks && rank>=0 && !ranks.includes(rank)) return "위치 제한";
  return part && condition(actor,part)==="lost"?`${parts[part]} 결손`:"";
}

function readyTimedSkill(battle){
  const ready=battle.skills.filter(skill=>skill.readyAt<=battle.elapsed && !skillBlocked(skill) &&
    (cards[skill.id].target!=="heal" || quickHealTarget()));
  // Slot position only controls display. Resolve simultaneous skills by role and cooldown.
  return ready.sort((a,b)=>a.readyAt-b.readyAt ||
    Number(cards[a.id].type==="attack")-Number(cards[b.id].type==="attack") ||
    b.cooldown-a.cooldown || a.id.localeCompare(b.id))[0];
}

function timedAttackTarget(id,actor){
  const {enemy}=game, skill=cards[id], effect=skill.effect || id;
  const amount=power(skill,actor);
  const damage=effect==="aim"?2:effect==="break"?1:amount;
  const pierce=effect==="aim" || effect==="break"?amount:0;
  const targets=intactParts(enemy);
  const dealt=target=>Math.max(0,Math.min(enemy.body[target].hp,damage-Math.max(0,enemy.body[target].guard-pierce)));
  if(dealt("head")>=enemy.body.head.hp) return "head";
  const prefer=target=>effect==="break"?Math.min(amount,enemy.body[target].guard):
    Number(Boolean(actor.jobs?.includes("warrior")) && condition(enemy,target)==="injured");
  return targets.reduce((best,target)=>{
    const order=dealt(target)-dealt(best) || prefer(target)-prefer(best);
    return order>0?target:best;
  },targets.includes("chest")?"chest":targets[0]);
}

function executePartySkill({id,side}){
  const skill=cards[id], actor=game[side];
  if(skill.type==="attack"){
    applyCard(id,actor,game.enemy,[timedAttackTarget(id,actor)]);
    clearDefense(game.enemy);
  }else if(skill.target==="heal"){
    const {side,target}=quickHealTarget();
    applyCard(id,actor,game.enemy,[target],game,game[side]);
  }else{
    const intent=condition(game.player,"eyes")==="healthy"?battleIntent()[0]:null;
    const recipient=intent?.side?game[intent.side]:actor;
    const target=intent?.side?intent.targets[0]:"head";
    const second=skill.target==="pair"?intactParts(recipient).find(part=>part!==target):null;
    const targets=second?[target,second]:[target];
    const previous=targets.map(key=>recipient.body[key].guard);
    clearDefense(recipient);
    applyCard(id,actor,game.enemy,targets,game,recipient);
    targets.forEach((key,index)=>{recipient.body[key].guard=Math.max(previous[index],recipient.body[key].guard);});
  }
}

function advanceAutoBattle(){
  if(game.phase!=="combat") return null;
  const battle=game.cooldownBattle;
  let skill=readyTimedSkill(battle);
  if(!skill && battle.elapsed<battle.enemyReadyAt){
    battle.elapsed+=battleTiming.tick;
    game.combatTime+=battleTiming.tick;
    if(battle.elapsed%battleTiming.pursuit===0){
      game.distance--;
      record("전투 시간 경과 · 도망 여유 −1");
      finishCombat();
      return {clockOnly:true};
    }
    skill=readyTimedSkill(battle);
  }
  if(skill){
    skill.readyAt=battle.elapsed+skill.cooldown;
    executePartySkill(skill);
    finishCombat();
    return {id:skill.id,actor:skill.side};
  }
  if(battle.elapsed>=battle.enemyReadyAt){
    const action=battleIntent()[0];
    const defender=game[action.side || "player"];
    game.enemyAction=0;
    if(cards[action.id].type==="defense") clearDefense(game.enemy);
    applyCard(action.id,game.enemy,defender,action.targets);
    if(cards[action.id].type==="attack") clearDefense(defender);
    game.enemyAction=null;
    battle.enemyIndex=(battle.enemyIndex+1)%battle.enemySkills.length;
    battle.enemyReadyAt+=battleTiming.enemyInterval;
    finishCombat();
    return {id:action.id,actor:"enemy",keepIntent:true};
  }
  return {clockOnly:true};
}

function cancelAutoBattleTimer(){
  if(autoTimer!==null) clearTimeout(autoTimer);
  autoTimer=null;
}

function scheduleAutoBattle(){
  cancelAutoBattleTimer();
  if(!game || game.phase!=="combat" || autoPaused || document.hidden || combatPresentation || routeTravel) return;
  const current=game, enemy=game.enemy;
  const battle=game.cooldownBattle;
  const delay=readyTimedSkill(battle) || battle.elapsed>=battle.enemyReadyAt?0:battleTiming.tick;
  const timer=setTimeout(()=>{
    if(autoTimer!==timer) return;
    autoTimer=null;
    if(game!==current || game.enemy!==enemy || game.phase!=="combat" || autoPaused || document.hidden || combatPresentation || routeTravel) return;
    const distance=game.distance;
    const action=advanceAutoBattle();
    if(action?.clockOnly){
      if(game.distance!==distance || game.phase!=="combat") render();
      else {
        updateCooldownReadout();
        scheduleAutoBattle();
      }
    }else if(action) playCombatFeedback(undefined,action.keepIntent);
  },delay/autoSpeed);
  autoTimer=timer;
}

function renderAutoControls(){
  const pause=document.querySelector("#auto-pause");
  pause.disabled=game.phase!=="combat";
  pause.textContent=autoPaused?"전투 계속":"전투 일시정지";
  pause.setAttribute("aria-pressed",String(autoPaused));
  const speed=document.querySelector("#auto-speed");
  speed.textContent=`배속 ${autoSpeed}×`;
  speed.setAttribute("aria-label",`전투 배속 ${autoSpeed}배, 누르면 다음 배속`);
}

function toggleAutoPause(){
  if(game.phase!=="combat") return;
  autoPaused=!autoPaused;
  cancelAutoBattleTimer();
  renderAutoControls();
  if(!combatPresentation) render();
  scheduleAutoBattle();
}

function cycleAutoSpeed(){
  autoSpeed=autoSpeed===4?1:autoSpeed*2;
  renderAutoControls();
  scheduleAutoBattle();
}

function lose(reason){
  game.phase="lost";
  game.reason=reason;
  record(reason);
}

function finishCombat(){
  if(game.phase!=="combat") return true;
  if(isDown(game.player)){
    lose(!game.player.body.head.hp?"머리가 결손되어 쓰러졌어요.":"전체 HP가 0이 되어 쓰러졌어요.");
  }else if(isDown(game.enemy)){
    game.phase="route";
    for(const side of partySides()) clearDefense(game[side]);
    record(`${game.enemy.name} 격파 · 다음 길을 선택하세요.`);
    const area=areas[game.area];
    game.recruitQueue=(area.companions || [area.companion]).filter(kind=>canRecruit(kind) && !game.metCompanions.has(kind));
    nextCompanionOffer();
    if(game.mapConfig) game.coins++;
    if(hasUpcomingBattle(game.area)){
      game.rewards=skillRewardOptions();
      if(game.rewards.length) game.phase="reward";
    }
  }else if(game.distance<=0){
    lose("기도를 받았던 사형수에게 따라잡혔어요.");
  }
  return game.phase!=="combat";
}

function hasUpcomingBattle(id){
  return (areas[id].next || []).some(next=>areas[next].foe || hasUpcomingBattle(next));
}

function skillRewardOptions(){
  const newSkills=shuffle(rewardPool.filter(id=>!game.skillLevels[id]));
  const upgrades=shuffle(Object.keys(game.skillLevels).filter(id=>skillLevel(id)<maxSkillLevel));
  return [newSkills[0],upgrades[0],...shuffle([...newSkills.slice(1),...upgrades.slice(1)])].filter(Boolean).slice(0,3);
}

function chooseReward(id){
  if(game.phase!=="reward" || (id!==null && !game.rewards.includes(id))) return false;
  if(id!==null){
    const previous=game.skillLevels[id] || 0;
    if(previous>=maxSkillLevel) return false;
    game.skillLevels[id]=previous+1;
    record(previous?`${cards[id].name} 강화 · Lv.${previous+1}`:`기술 습득 · ${cards[id].name}`);
  }else record("전투 보상을 건너뛰었어요.");
  game.rewards=[];
  game.phase="route";
  return true;
}

function canRecruit(kind){
  return Object.hasOwn(companionTypes,kind) && !game.deadCompanions.includes(kind) &&
    livingRoster().every(side=>game[side].kind!==kind);
}

function nextCompanionOffer(){
  game.pendingCompanion=game.recruitQueue.shift() ?? null;
  if(game.pendingCompanion) game.metCompanions.add(game.pendingCompanion);
}

function recruitCompanion(kind){
  if(game.phase!=="route" || game.pendingCompanion!==kind || !canRecruit(kind)) return false;
  const sides=partySides();
  const side=companionSides.find(key=>!game[key] || isDown(game[key]));
  const type=companionTypes[kind];
  const starters=companionStarterSkills(kind);
  const loadout=Array.from({length:companionSkillSlots},(_,slot)=>starters[slot] ?? null);
  const actor={...fighter(type.name,type.health,type.vitality),kind,weapon:type.weapon,factions:type.factions,jobs:type.jobs,loadout};
  if(type.hurtArm){
    actor.body.arms.hp=type.hurtArm;
    actor.hp-=type.health[2]-type.hurtArm;
  }
  game[side]=actor;
  if(sides.length===1 && game.formation[0]==="player") game.formation=[null,null,"player"];
  const empty=game.formation.indexOf(null);
  if(empty>=0){
    const rank=type.preferredRank ?? empty;
    game.formation[empty]=game.formation[rank];
    game.formation[rank]=side;
  }
  nextCompanionOffer();
  record(`${type.name} 합류${starters.length?` · ${starters.map(id=>cards[id].name).join(" · ")}`:""}`);
  return true;
}

function declineCompanion(){
  if(game.phase!=="route" || !game.pendingCompanion) return false;
  record(`${companionTypes[game.pendingCompanion].name}와(과) 동행하지 않고 길을 이어가요.`);
  nextCompanionOffer();
  return true;
}

function canMoveTo(id){
  return game.phase==="route" && !game.pendingCompanion && !game.pendingMystery && areas[game.area].next.includes(id);
}

function moveTo(id){
  if(!canMoveTo(id)) return;
  const gain=travelGain();
  game.distance+=gain;
  game.steps++;
  game.trail.push(id);
  game.area=id;
  const destination=areas[id].type==="mystery"?"? 방":areas[id].name;
  record(`${destination} 도착 · 도망 여유 +${gain}`);
  if(game.distance<=0) lose("이동 후에도 도망 여유가 없어 사형수에게 따라잡혔어요.");
  else enterArea(id);
}

function canTakeMystery(event){
  return game.distance+event.distance>0 && game.coins+event.coins>=0;
}

function resolveMystery(choice){
  const event=mysteryEvents[game.pendingMystery];
  if(game.phase!=="route" || !event) return false;
  if(choice==="take"){
    if(!canTakeMystery(event)) return false;
    game.distance+=event.distance;
    game.coins+=event.coins;
    record(`${event.name} · ${event.effect}`);
  }else if(choice==="skip") record(`${event.name} · 지나침`);
  else return false;
  game.pendingMystery=null;
  return true;
}

function treatAtStairs(target,side="player"){
  const actor=game[side], part=actor?.body[target];
  if(game.phase!=="route" || areas[game.area].type!=="rest" || game.stairTreatment || game.distance<=1 ||
     !partySides().includes(side) || !part?.hp || part.hp===part.max) return false;
  const recovered=healPart(actor,target,2);
  game.distance--;
  game.stairTreatment={name:actor.name,target,recovered};
  record(`정비 계단에서 ${actor.name} ${parts[target]} 내구도 +${recovered} · 도망 여유 −1`);
  return true;
}

function healthBar(actor){
  return `<span class="health-bar" aria-hidden="true"><i style="--life:${actor.hp/actor.maxHp*100}%"></i></span>`;
}

function actorHealth(actor,defeated=""){
  const label=defeated || `체력 ${actor.hp}/${actor.maxHp}`;
  return `${healthBar(defeated?{...actor,hp:0}:actor)}<b class="hp-value" role="img" aria-label="${label}">${defeated || `${actor.hp}/${actor.maxHp}`}</b>`;
}

function pursuerPosition(distance){
  return Math.max(5,88-Math.max(0,distance)*5);
}

function combatSeconds(milliseconds){
  return `${(milliseconds/1000).toFixed(1)}초`;
}

function pursuitCountdown(){
  return battleTiming.pursuit-game.cooldownBattle.elapsed%battleTiming.pursuit;
}

function combatReport(){
  return combatSeconds(game.combatTime);
}

function gauges(){
  const combat=game.phase==="combat";
  const timed=combat && game.cooldownBattle;
  const distance=Math.max(0,game.distance);
  const pursuit=timed?`<span id="pursuit-countdown">${combatSeconds(pursuitCountdown())}</span> 뒤 −1`:"";
  const activity=timed?`<div class="status-box"><strong id="combat-elapsed">${combatSeconds(timed.elapsed)}</strong><div><p>전투 경과</p></div></div>`:
    `<div class="status-box"><strong>${game.steps}</strong><div><p>이동한 칸</p><small>전투 소모 ${combatReport()}</small></div></div>`;
  return `<div class="status-box pursuit ${distance<=pursuitWarningDistance?"urgent":""}"><strong>${distance}</strong><div><p>사형수 추격 · 도망 여유</p>
    <small>${pursuit?`${pursuit} · `:""}다음 이동 +${travelGain()}</small></div>
    <div class="pursuit-track" role="img" aria-label="기도를 받았던 사형수가 뒤쫓는 중 · 남은 도망 여유 ${distance}">
      <span class="pursuer" style="--near:${pursuerPosition(distance)}%">${icon("pursuer")}</span>
      <span class="runner">${icon("runner")}</span>
    </div></div>
    ${activity}${combat?"":`<div class="status-box health ${game.player.hp<=7?"urgent":""}"><strong>${game.player.hp}/${game.player.maxHp}</strong><div><p>체력</p></div>${healthBar(game.player)}</div>`}`;
}

function intentLabel(action,state=game){
  const {id,targets}=action, card=cards[id];
  const amount=power(card,state.enemy);
  const target=targets.map(key=>parts[key]).join("·");
  const detail=id==="aid"?healValue(state.enemy):
    ["aim","break","counter"].includes(id)?card.text(amount):amount;
  return `${target?`${target} `:""}${card.name} ${detail}`;
}

function battleIntent(){
  if(!game.cooldownBattle) return [];
  const action=resolveIntent(timedEnemyPlan()) || resolveIntent({id:"strike",targets:["chest"]});
  return [{...action,planIndex:0}];
}

function layoutCombatHud(scene){
  const rail=scene.querySelector(".intent-rail");
  const intent=rail.firstElementChild;
  const head=scene.querySelector('.actor-enemy [data-value="head"]').getBoundingClientRect();
  const center=head.left+head.width/2-rail.getBoundingClientRect().left;

}
const combatHudResize=new ResizeObserver(([entry])=>layoutCombatHud(entry.target));

function intentPanel(intents, eyes){
  const planned=timedEnemyPlan();
  const changes=intents.some(action=>action.id!==planned.id || (action.side && planned.side!==action.side));
  const heading=changes&&eyes==="healthy"?"변경된 예고":"적 행동 예고";
  const chips=eyes!=="healthy"
    ? `<span class="intent-chip" title="눈 부상으로 예고가 가려짐" role="img" aria-label="눈 부상으로 예고가 가려짐">${icon("hiddenIntent")}<strong>?</strong></span>`
    : intents.map(action=>{
      const {id}=action;
      const card=cards[id],type=card.type,amount=power(card,game.enemy);
      const value=id==="aim"?2:id==="break"?1:id==="aid"?`+${healValue(game.enemy)}`:
        type==="defense"?`+${guardAmount(id,game.enemy)}`:amount;
      const attackLink=type==="attack"?` data-attack-side="${action.side}" data-attack-target="${action.targets[0]}" data-attack-source="${cards[action.id].part || "chest"}"`:"";
      const targetName=type==="attack" && partySides().length>1?`${game[action.side].name} `:"";
      const label=`${targetName}${intentLabel(action)}`;
      const targets=action.targets.length?`<span class="intent-target ${companionSides.includes(action.side)?"ally":action.side || "enemy"}">${action.targets.map(icon).join("")}</span>`:"";
      return `<span class="intent-chip ${type}" data-intent="${action.planIndex}"${attackLink} role="img" title="${label}" aria-label="${label}">${icon(type)}<strong>${value}</strong>${targets}</span>`;
    }).join("") || '<span aria-label="행동 없음">—</span>';
  const timer=game.cooldownBattle && eyes==="healthy"?`<span class="intent-chip intent-time" title="다음 적 행동까지">${icon("clock")}<strong id="enemy-cooldown">${combatSeconds(game.cooldownBattle.enemyReadyAt-game.cooldownBattle.elapsed)}</strong></span>`:"";
  return `<div class="intent-rail"><div class="intent" role="group" aria-label="${heading}">${chips}${timer}</div></div>`;
}

function bodyTiles(side,intents,eyes,anchors){
  const actor=game[side];
  const enemy=side==="enemy";
  const inCombat=game.phase==="combat";
  const threats=new Set(intents.filter(action=>cards[action.id].type==="attack" && action.side===side).flatMap(action=>action.targets));
  const guardIntents=enemy && eyes==="healthy"?intents.filter(action=>cards[action.id].type==="defense"):[];
  return Object.entries(actor.body).map(([id,part],index)=>{
    const level=condition(actor,id);
    const threat=!enemy && eyes==="healthy" && threats.has(id);
    const guard=!enemy && eyes==="lost"?"?":part.guard;
    const guarded=guard>0;
    const upcoming=guardIntents.reduce((total,action)=>total+(action.targets.includes(id)?guardAmount(action.id,actor):0),0);
    const guardReadout=!inCombat?"":guarded || upcoming?`<span class="part-guard">${icon("defense")}${guarded?`<b>${guard}</b>`:""}${upcoming?`<b class="guard-upcoming">+${upcoming}</b>`:""}</span>`:`<span>가드 ${guard}</span>`;
    const position=anchors?`style="--x:${anchors[index][0]}%;--y:${anchors[index][1]}%"`:"";
    return `<div data-side="${side}" data-value="${id}"
      class="part ${level} ${threat?"threat":""} ${guarded?"guarded":""} ${upcoming?"guard-intent":""}"
      ${position}
      title="${side==="player"?effects[id]:!enemy && id==="arms"?"팔 결손 시 팔 기술 사용 불가":""}" aria-label="${actor.name} ${parts[id]} ${labels[level]} 내구도 ${part.hp}/${part.max}${inCombat?` 가드 ${guard}`:""}${upcoming?` · 가드 +${upcoming} 예정`:""}">
      ${anchors?"":partDrawing(id)}
      <span class="part-top"><b>${parts[id]}</b><small>${labels[level]}</small></span>
      <span class="bar" style="--life:${part.hp/part.max*100}%"><i></i></span>
      <span class="part-stats"><span>${part.hp}/${part.max}</span>${guardReadout}</span></div>`;
  }).join("");
}

function legStatusLabel(legs, previous){
  if(legs==="healthy") return "";
  const change=previous?`+${travelGain(previous)} → `:"";
  return `<b>다리 ${labels[legs]}</b><span>다음 이동 ${change}+${travelGain(legs)}</span>`;
}

function bodyStatus(actor){
  const lost=Object.values(actor.body).filter(part=>part.hp===0).length;
  const injured=Object.values(actor.body).filter(part=>part.hp>0 && part.hp*2<=part.max).length;
  return lost?`결손 ${lost}`:injured?`부상 ${injured}`:"정상";
}

function partDrawing(id){
  return `<img class="part-drawing" src="art/body-parts/${id}.webp" width="96" height="96" alt="" draggable="false">`;
}

function bodyWounds(actor){

}

function woundChips(wounds){

}

function skillReadout(skill,elapsed){
  const remaining=Math.max(0,skill.readyAt-elapsed);
  const blocked=skillBlocked(skill);
  const waiting=!remaining && cards[skill.id].target==="heal" && !quickHealTarget();
  return {blocked:Boolean(blocked),ready:!remaining && !blocked && !waiting,
    value:blocked?0:skill.cooldown-remaining,label:blocked || (remaining?combatSeconds(remaining):waiting?"회복 대기":"준비 완료")};
}

function skillTerm(term){
  return `<span class="skill-term">${icon(skillTerms[term].icon)}<strong>${term}</strong></span>`;
}

function skillEffectLines(id,actor,term){
  const skill=cards[id];
  const amount=power(skill,actor);
  switch(skill.effect || id){
    case "aim": return ["한 부위 피해 2",`${term("관통")} ${amount} · ${term("가드")} 무시`];
    case "break": return [`${term("가드")} ${amount} 제거`,"한 부위 피해 1"];
    case "guard": return [`한 부위 ${term("가드")} +${amount}`];
    case "split": return [`두 부위에 각각 ${term("가드")} +${amount}`];
    case "aid": return [`한 부위 내구도 최대 ${amount} 회복`,
      `대상의 배 ${term("부상")} 시 회복량 절반`,
      `${term("결손")} 부위는 회복 불가`];
    default: return [`한 부위 피해 ${amount}`];
  }
}

function skillCardText(id,actor=game.player){

  const type=skill.type==="skill"?"회복":categories[skill.type];
  const terms=new Set([type]);
  const lines=skillEffectLines(id,actor,name=>{
    terms.add(name);
    return skillTerm(name);
  });
  return {type:skillTerm(type),lines,terms};
}

function updateCooldownReadout(){
  const stage=document.querySelector("#stage");
  const panel=stage.querySelector(".skill-loadout");
  if(!panel) return;
  const {skills,elapsed,enemyReadyAt}=game.cooldownBattle;
  for(const skill of skills){
    const node=panel.querySelector(`[data-skill="${skill.id}"]`);
    if(!node) continue;
    const state=skillReadout(skill,elapsed);
    node.dataset.ready=state.ready;
    node.dataset.blocked=state.blocked;
    node.querySelector("progress").value=state.value;
    node.querySelector(".skill-remaining").textContent=state.label;
  }
  document.querySelector("#combat-elapsed").textContent=combatSeconds(elapsed);
  document.querySelector("#pursuit-countdown").textContent=combatSeconds(pursuitCountdown());
  const enemyCountdown=stage.querySelector("#enemy-cooldown");
  if(enemyCountdown) enemyCountdown.textContent=combatSeconds(enemyReadyAt-elapsed);
}

  return areas[id].type || (id==="exit"?"exit":id==="lift"?"elite":"battle");

function mapPanel(){
  const next=areas[game.area].next;
  const gain=travelGain();
  const types={battle:{icon:"routeBattle",label:"전투"},rest:{icon:"routeRest",label:"휴식·치료"},shop:{icon:"routeShop",label:"상점"},mystery:{icon:"routeMystery",label:"사건"},elite:{icon:"routeElite",label:"강적"},boss:{icon:"routeBoss",label:"보스"},exit:{icon:"routeExit",label:"출구"}};
  const roomTypes=new Set(Object.keys(areas).map(routeType));
  const columns=Math.max(...Object.values(areas).map(area=>area.col));
  const traveled=new Set(game.trail.slice(1).map((id,i)=>`${game.trail[i]}-${id}`));
  const nodes=Object.entries(areas).map(([id,area])=>{
    const current=id===game.area;
    const visited=game.trail.includes(id);
    const reachable=next.includes(id);
    const kind=routeType(id), type=types[kind];
    const state=current?"현재 위치":visited?"완료":reachable?"이동 가능":"";
    const tag=reachable?"button":"div";
    return `<${tag} class="map-node ${current?"current":visited?"visited":reachable?"next":""}" data-room="${id}" data-room-type="${kind}" aria-label="${area.name} · ${type.label}${state?` · ${state}`:""}" ${current?'aria-current="location"':""}
      ${reachable?`type="button" data-action="move" data-value="${id}"`:""}
      style="--col:${area.col};--row:${area.row}"><span class="room-icon">${icon(type.icon)}</span><b>${area.name}</b>
      ${state?`<span class="room-state">${state}</span>`:""}</${tag}>`;
  }).join("");
  const lines=Object.entries(areas).flatMap(([id,area])=>(area.next||[]).map(dest=>{
    const edge=`${id}-${dest}`;
    return `<line class="${traveled.has(edge)?"walked":""}" data-edge="${edge}" data-from="${id}" data-to="${dest}"/>`;
  })).join("");
  return `<section class="route-map" aria-label="전체 경로 지도"><div class="map-head"><h3>전체 경로</h3><small>${game.mapConfig?`동전 ${game.coins} · `:""}다음 이동 · 도망 여유 +${gain}</small></div>
    <div class="route-legend">${Object.entries(types).filter(([key])=>roomTypes.has(key)).map(([,type])=>`<span>${icon(type.icon)}${type.label}</span>`).join("")}</div>
    <div class="map-layout" style="--map-stages:${columns}"><svg class="map-lines" aria-hidden="true">${lines}</svg>${nodes}</div></section>`;
}

function centerInFrame(node,frame){
  const rect=node.getBoundingClientRect();
  return {x:rect.left+rect.width/2-frame.left,y:rect.top+rect.height/2-frame.top};
}

function layoutMapLinks(layout){
  const frame=layout.getBoundingClientRect();
  const centers=Object.fromEntries(Array.from(layout.querySelectorAll(".map-node"),node=>
    [node.dataset.room,centerInFrame(node,frame)]));
  for(const line of layout.querySelectorAll("[data-edge]")){
    const from=centers[line.dataset.from], to=centers[line.dataset.to];
    line.setAttribute("x1",from.x);
    line.setAttribute("y1",from.y);
    line.setAttribute("x2",to.x);
    line.setAttribute("y2",to.y);
  }
}
const mapResize=new ResizeObserver(([entry])=>layoutMapLinks(entry.target));

function treatmentPanel(){
  const area=areas[game.area];
  if(area.type!=="rest") return "";
  const patients=partySides().map(side=>({side,actor:game[side],wounds:woundedParts(game[side])}));
  const treated=game.stairTreatment;
  let message="도망 여유 1을 써서 한 부위의 내구도를 최대 2 회복해요.";
  if(!patients.some(patient=>patient.wounds.length)) message="치료할 수 있는 부상이 없어요.";
  else if(game.distance<=1) message="치료에 쓸 도망 여유가 부족해요.";
  const options=treated || game.distance<=1?"":patients.map(({side,actor,wounds})=>{
    const buttons=wounds.map(([id,part])=>`<button type="button" class="btn" data-action="treat" data-side="${side}" data-value="${id}" aria-label="${actor.name} ${parts[id]} 치료 ${part.hp}에서 ${Math.min(part.max,part.hp+2)}">${parts[id]} ${part.hp} → ${Math.min(part.max,part.hp+2)}</button>`).join("");
    return `<div class="treatment-group" data-patient="${side}"><strong>${actor.name}</strong>${buttons?`<div class="treatment-options">${buttons}</div>`:'<small>치료할 부상 없음</small>'}</div>`;
  }).join("");
  const illustration=treated?eventIllustration("aid","healing","치료 완료",`${treated.name} ${parts[treated.target]} 내구도 +${treated.recovered}`):"";
  return `<section class="treatment" aria-label="${area.name} 치료"><h3>${area.name} 치료</h3>${treated?"":`<p>${message}</p>`}
    ${options?`<div class="treatment-options">${options}</div>`:""}${illustration}</section>`;
}

function buyShortcut(){
  if(game.phase!=="route" || areas[game.area].type!=="shop" || game.shopBought || game.coins<1) return;
  game.coins--;
  game.distance+=2;
  game.shopBought=true;
  record("암시장 · 뒷길 정보 · 도망 여유 +2");
}

function shopPanel(){
  if(areas[game.area].type!=="shop") return "";
  return `<section class="treatment" aria-label="암시장"><h3>암시장 · 동전 ${game.coins}</h3>
    ${game.shopBought?'<small>도망 여유 +2</small>':`<div><button type="button" class="btn" data-action="buy-shortcut" ${game.coins<1?"disabled":""}>뒷길 정보 · 동전 1 · 도망 여유 +2</button></div>`}</section>`;
}

function partyNotice(){
  const companions=partySides().filter(side=>side!=="player").map(side=>game[side].name);
  const reserves=reserveSides().map(side=>game[side].name);
  const fallen=game.deadCompanions.map(kind=>companionTypes[kind].name);
  return [game.phase==="route" && companions.length?`동행 · ${companions.join(" · ")}`:"",
    game.phase==="route" && reserves.length?`대기 · ${reserves.join(" · ")}`:"",
    fallen.length?`사망 · ${fallen.join(" · ")}`:""].filter(Boolean).map(label=>`<p class="party-notice">${label}</p>`).join("");
}

function recruitmentTraitPreview(candidate){
  const sides=partySides();
  const before=countTraits(sides.map(side=>game[side]));
  const full=sides.length===formationRanks.length;
  const swaps=full?sides.filter(side=>side!=="player"):[null];
  return swaps.map(outgoing=>{
    const actors=sides.filter(side=>side!==outgoing).map(side=>game[side]);
    const after=countTraits([...actors,candidate]);
    const gains=[...after].filter(([id,count])=>traits[id].effect && count>=traitThreshold && (before.get(id) || 0)<traitThreshold);
    if(!gains.length) return "";
    const label=outgoing?`${game[outgoing].name} 교대`:"시너지";
    return `<div class="trait-preview"><span>${label}</span>${gains.map(([id,count])=>traitChip(id,`${before.get(id) || 0}→${count}`)).join("")}</div>`;
  }).join("");
}

function companionEncounterPanel(){
  const kind=game.pendingCompanion, type=companionTypes[kind];
  if(!canRecruit(kind)) return "";
  const options=companionStarterSkills(kind).map(id=>cards[id].name).join(" · ");
  return `<section class="treatment companion-encounter" aria-label="동료와의 만남"><img class="encounter-portrait" src="${partyArt[kind].src}" width="1024" height="1536" alt="${type.name}"><div><h3>${type.name}</h3>
    ${traitTags(type)}<p>${type.introduction}</p><p>${options}</p>
    ${recruitmentTraitPreview(type)}
    <div class="treatment-options"><button type="button" class="btn primary" data-action="recruit" data-value="${kind}">${partySides().length===formationRanks.length?"영입 · 대기":"함께 가기"}</button>
      <button type="button" class="btn" data-action="decline-companion">지나가기</button></div></div></section>`;
}

function mysteryPanel(){
  const event=mysteryEvents[game.pendingMystery];
  if(!event) return "";
  return `<section class="routes mystery-room" aria-label="사건"><div class="mystery-heading"><h2>${event.name}</h2><small>동전 ${game.coins}</small></div><p>${event.description}</p>

function routePanel(){
  const next=areas[game.area].next;
  const gain=travelGain();
  const heading=next.length>1?"갈림길에서 방향을 고르세요":"다음 칸으로 이동하세요";
  return `<section class="routes"><h2>${heading}</h2>${game.distance+gain<=0?'<p class="danger">이동해도 도망 여유가 0이라 따라잡혀요.</p>':""}
    ${partyNotice()}${treatmentPanel()}${shopPanel()}${mapPanel()}</section>`;
