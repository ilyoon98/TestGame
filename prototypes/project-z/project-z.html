<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project Z 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 색은 역할 하나씩 — VISUAL_DESIGN.md 2절 */
:root{
  --bg:#e3ebe5;--paper:#f8f6f0;--paper2:#eeebe2;--ink:#1f2a24;--sub:#66736b;--line:#d3d9d0;
  --act:#2f6b4f;--act-ink:#fff;--gold:#b97f12;--danger:#c4513b;--calm:#3f84ad;
  --grass:#8cc25a;--forest:#4f8f4a;--water:#5ea7cc;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a17;--paper:#1d2420;--paper2:#252d28;--ink:#e6ebe5;--sub:#99a59d;--line:#333d37;
  --act:#5aa47f;--act-ink:#0f1512;--gold:#e2ac43;--danger:#e27a64;--calm:#78b5da;}}
:root[data-theme="dark"]{--bg:#141a17;--paper:#1d2420;--paper2:#252d28;--ink:#e6ebe5;--sub:#99a59d;--line:#333d37;--act:#5aa47f;--act-ink:#0f1512;--gold:#e2ac43;--danger:#e27a64;--calm:#78b5da}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
body{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;overflow:hidden}
.num,.metric b,.meta b{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 12px;letter-spacing:inherit}
button:hover:not(:disabled){border-color:var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--act);border-color:var(--act);color:var(--act-ink);font-weight:600}
button.sm{padding:3px 10px;font-size:12.5px}
button.danger{color:var(--danger);border-color:var(--danger)}
/* 상단 */
.top{display:flex;align-items:center;gap:32px;padding:14px 24px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.brand small{color:var(--sub);font-size:11.5px}
.metric{display:flex;flex-direction:column;line-height:1.15}
.metric small{color:var(--sub);font-size:11.5px}
.metric b{font-size:20px;font-weight:700}
.gold{color:var(--gold)}.danger-t{color:var(--danger)}.good-t{color:var(--act)}.calm-t{color:var(--calm)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper)}
.seg button{border:0;border-radius:0;padding:5px 11px;font-size:12.5px;background:transparent}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--paper)}
.grow{flex:1}
.status{display:flex;gap:18px;flex-wrap:wrap;padding:7px 24px;font-size:12.5px;background:var(--paper2);border-bottom:1px solid var(--line)}
.status:empty{display:none}
.status a{cursor:pointer;color:inherit;text-decoration:none}
.status a::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:7px;vertical-align:1px}
/* 본문 */
.shell{display:grid;grid-template-columns:140px minmax(0,1fr);min-height:0}
#tabs{display:flex;flex-direction:column;gap:4px;padding:16px 10px;border-right:1px solid var(--line)}
#tabs button{display:flex;align-items:center;justify-content:space-between;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:6px;font-size:14.5px}
#tabs button:hover{background:var(--paper2)}
#tabs button.on{background:var(--act);color:var(--act-ink);font-weight:600}
#tabs .cnt{font-size:12px;font-weight:700;color:var(--danger)}
#tabs .on .cnt{color:var(--act-ink)}
#tabs .ver{margin-top:auto;padding:0 12px;font-size:11px;color:var(--sub)}
.content{display:flex;flex-direction:column;min-height:0;min-width:0}
#zoo3d{position:relative;height:clamp(220px,50vh,540px);flex-shrink:0;display:none;border-bottom:1px solid var(--line)}
#zoo3d.show{display:block}
#zoo3d canvas{position:absolute;left:0;top:0}
#zcv{cursor:pointer}#zov{pointer-events:none}
main{flex:1;overflow:auto;padding:20px 24px 28px}
.sec{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.sec h2{margin:0;font-size:18px;font-weight:700}
.sec .meta{font-size:12.5px}
.sec+.sec,.block+.sec{margin-top:26px}
.meta{color:var(--sub);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.card.picked{border-color:var(--act);box-shadow:inset 0 0 0 1px var(--act)}
.card.ghost{background:transparent;border-style:dashed}
.card h3{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex-shrink:0}
.state{font-size:12.5px;font-weight:600;margin-top:3px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.thumbs{display:flex;gap:6px;margin:12px 0 10px;flex-wrap:wrap}
.thumb{width:52px;height:52px;border-radius:6px;background:var(--paper2);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;cursor:pointer;padding:0}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb.sel{border-color:var(--act);box-shadow:inset 0 0 0 1px var(--act)}
.thumb.empty{border-style:dashed;background:transparent;cursor:default}
.ph{font-weight:700;color:var(--sub)}
.foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.money{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px;flex-wrap:wrap}
.item .pic{width:60px;height:60px;border-radius:6px;background:var(--paper2);flex-shrink:0;overflow:hidden;display:grid;place-items:center}
.item .pic img{width:100%;height:100%;object-fit:contain}
.item .txt{flex:1;min-width:160px}
.item .txt b{font-size:15px}
.tag{font-size:11.5px;font-weight:700;margin-left:6px}
.detail{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--paper);border:1px solid var(--act);border-radius:8px;padding:12px 16px;margin-bottom:18px}
.detail .pic{width:84px;height:84px;border-radius:8px;background:var(--paper2);overflow:hidden}
.detail .pic img{width:100%;height:100%;object-fit:contain}
.meter{display:grid;grid-template-columns:34px 1fr 30px;gap:6px 10px;align-items:center;font-size:12px;margin:10px 0}
.meter span:nth-child(3n){text-align:right;font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--paper2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%}
.keeper{display:grid;grid-template-columns:64px 1fr;gap:14px}
.keeper .pic{width:64px;height:64px;border-radius:8px;background:var(--paper2);overflow:hidden}
.keeper .pic img{width:100%;height:100%;object-fit:cover}
.pic.unknown img{filter:brightness(0);opacity:.22}
.note{font-size:12.5px;color:var(--sub);max-width:640px;margin:-4px 0 14px}
.log{border-top:1px solid var(--line);background:var(--paper);padding:6px 24px;font-size:12px;color:var(--sub);height:56px;overflow:hidden;font-variant-numeric:tabular-nums}
.log div:first-child{color:var(--ink)}
/* 탐험 */
#exp{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:20}
#exp.show{display:flex}
#exp .etop{display:flex;align-items:center;gap:20px;padding:12px 20px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
#exp .etop .hint{flex:1;font-size:13.5px}
#exp .ebot{display:flex;align-items:stretch;gap:10px;padding:12px 20px;background:var(--paper);border-top:1px solid var(--line);flex-wrap:wrap}
#exp .tool{min-width:104px;padding:10px 14px;text-align:left;background:var(--paper2);border-color:var(--paper2)}
#exp .tool b{display:block;font-size:14px}
#exp .tool small{color:var(--sub);font-variant-numeric:tabular-nums}
#exp .tool.on{background:var(--act);border-color:var(--act);color:var(--act-ink)}
#exp .tool.on small{color:var(--act-ink);opacity:.8}
#exp .rope{display:flex;align-items:center;gap:10px;margin-left:auto}
#exp .pull{background:var(--act);border-color:var(--act);color:var(--act-ink);font-weight:600;padding:10px 18px}
#cwrap{flex:1;position:relative;overflow:hidden}
canvas{touch-action:none;display:block}
#cwrap canvas{position:absolute;left:0;top:0}
#ov{pointer-events:none}
/* 정산 */
#modal{position:fixed;inset:0;background:rgba(20,26,23,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
#modal.show{display:flex}
#modal .box{background:var(--bg);border-radius:10px;max-width:760px;width:100%;max-height:100%;overflow:auto;padding:20px;border:1px solid var(--line)}
@media (max-width:760px){
  .top{gap:10px 16px;padding:10px 14px;flex-wrap:wrap}.brand{display:none}.metric b{font-size:16px}.top .grow{display:none}
  .shell{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  #tabs{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 10px}
  #tabs button{padding:7px 11px;white-space:nowrap;gap:6px}#tabs .ver{display:none}
  main{padding:14px 16px}.status{padding:6px 16px}.log{padding:6px 16px}
}
</style>
</head>
<body>
<header class="top" id="top"></header>
<div class="status" id="status"></div>
<div class="shell">
  <nav id="tabs"></nav>
  <div class="content">
    <div id="zoo3d"><canvas id="zcv"></canvas><canvas id="zov"></canvas></div>
    <main id="main"></main>
  </div>
</div>
<div class="log" id="log"></div>

<div id="exp">
  <div class="etop" id="etop"></div>
  <div id="cwrap"><canvas id="cv"></canvas><canvas id="ov"></canvas></div>
  <div class="ebot" id="ebot"></div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
'use strict';
// ───────────────────────── 데이터 ─────────────────────────
const HAB={grass:{n:'초원',i:'🌾',c:'#a5d36e',build:250},forest:{n:'숲',i:'🌲',c:'#5d9b58',build:350},water:{n:'수변',i:'🌊',c:'#5fb2d9',build:500}};
const SP={
  bunny :{n:'솜털토끼',  e:'🐰',hab:'grass', p:'food',  hp:60, spd:55, inc:4, w:3},
  ram   :{n:'뿔양',      e:'🐏',hab:'grass', p:'strong',hp:120,spd:50, inc:7, w:2},
  fox   :{n:'바람여우',  e:'🦊',hab:'forest',p:'flee',  hp:80, spd:105,inc:6, w:2},
  bear  :{n:'이끼곰',    e:'🐻',hab:'forest',p:'strong',hp:160,spd:45, inc:10,w:1},
  mush  :{n:'버섯골렘',  e:'🍄',hab:'forest',p:'food',  hp:90, spd:40, inc:8, w:2,mon:1},
  otter :{n:'물방울수달',e:'🦦',hab:'water', p:'hide',  hp:70, spd:85, inc:7, w:2},
  kraken:{n:'꼬마크라켄',e:'🐙',hab:'water', p:'hide',  hp:110,spd:70, inc:9, w:1,mon:1},
  dragon:{n:'불씨 드래곤',e:'🐲',hab:'grass',p:'strong',hp:300,spd:95, inc:20,w:0,mon:1,epic:0.15},
};
const PERS={food:'먹이 선호',flee:'도주 성향',strong:'강한 저항',hide:'은신 성향'};
const NAMES=['김초롱','박도담','이하람','최누리','정다솜','한별','윤소담','오가람','서나래','장보미','임라온','강새벽','문가온','배이슬'];
// 보완안 수치 (DESIGN_NOTES.md 4절)
const C={
  real1h:2, exp1h:10,              // 실제 초 / 게임 1시간
  mgGap:0.3, mgNorm:1.0, mgSpec:1.2,
  fatWork:8, fatBed:12, fatFloor:4, owRate:5, owAfter:8, owRest2:1, forcedBack:30,
  resignWait:24, vacation:24, careHours:2, shelterHours:12, perKeeper:2,
  ropePow:[10,15,22], ropeDur:[100,160,250], towSpd:[70,80,92],
  stun:6, stunStrong:4, stunEpic:3.5, stunDecay:0.7, eatStun:1.5, trapDmg:30, trapHold:2,
  awakeTow:0.45, awakeTowStrong:0.25, ropeDrain:15,
  adoptMul:12, epicAdoptMul:3,
};
const SAVE_KEY='projectz-proto-v1';

// ───────────────────────── 상태 ─────────────────────────
let S, X=null, tab='zoo', mode='zoo';
const ui={sel:null,selEnc:null,confirm:null,msg:null,pressed:false};

function newGame(){
  S={gold:300,t:8,speed:1,shift:2,nid:1,
    enc:[],keepers:[],an:{},shelter:[],shelterCap:5,pending:[],
    inv:{dart:6,trap:2,food:4},rope:0,transport:3,hireCap:2,beds:1,restLv:1,
    event:null,codex:{},log:[],cands:[],candDay:-1,incomeH:0,expCount:0};
  S.enc.push(mkEnc('grass'));
  S.keepers.push(mkKeeper('김초롱','grass'), mkKeeper('박도담',null));
  reslot();
  log('동물원 개장. 탐험을 떠나 첫 동물을 데려오세요.');
}
function id(){return S.nid++}
function mkEnc(hab){return {id:id(),hab,cap:3,an:[],careUntil:0,cover:null,mg:C.mgGap,incH:0}}
function mkKeeper(name,spec){return {id:id(),name,spec,wage:spec?70:50,fat:0,ow:0,sh:0,slot:0,state:'rest',forced:false,bed:false,vacUntil:0,resignAt:null,payAt:S.t+24}}
function mkAnimal(sp){const a={id:id(),sp,loc:'pending',enc:null,remain:C.shelterHours};S.an[a.id]=a;return a}
const noEmo=s=>String(s).replace(/[\p{Extended_Pictographic}\u{1F3FB}-\u{1F3FF}‍️]/gu,'').replace(/\s{2,}/g,' ').trim();
function log(m){S.log.unshift(`${clock()}  ${noEmo(m)}`);S.log.length=Math.min(S.log.length,40)}
function clock(t=S.t){const d=Math.floor(t/24)+1,h=Math.floor(t%24),m=Math.floor((t%1)*60);return `${d}일 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`}
function fmtH(h){if(h<1)return Math.max(0,Math.round(h*60))+'분';return h.toFixed(1)+'시간'}
function g(n){return Math.round(n).toLocaleString()}
function reslot(){S.keepers.forEach((k,i)=>k.slot=i%S.shift)}
function adoptPrice(a){const s=SP[a.sp];return Math.round(s.inc*C.adoptMul*(s.epic?C.epicAdoptMul:1))}
function shiftName(i){return 'ABC'[i]+'조'}

// ───────────────────────── 시뮬레이션 (게임 시간 단위: 시간) ─────────────────────────
function tick(dt){
  S.t+=dt;
  const L=24/S.shift, cur=Math.floor((S.t%24)/L);
  const resting=[];
  for(const k of S.keepers){
    if(k.state==='vac'){
      if(S.t>=k.vacUntil){k.state='rest';k.ow=0;k.fat=0;log(`🏖️ ${k.name} 휴가 복귀 (과로 해소)`);}
      else continue;
    }
    if(k.forced&&k.fat<=C.forcedBack)k.forced=false;
    if(k.slot===cur&&!k.forced){
      if(k.state!=='work'){k.state='work';k.sh=0;}
      k.fat+=C.fatWork*dt;k.sh+=dt;
      if(k.sh>C.owAfter)k.ow+=C.owRate*dt;
      if(k.fat>=100){k.fat=100;k.forced=true;k.state='rest';log(`😵 ${k.name} 피로 한계 — 교대 전 강제 휴식 (관리 공백 발생)`);}
    }else{k.state='rest';k.sh=0;}
    if(k.state==='rest')resting.push(k);
  }
  resting.sort((a,b)=>b.fat-a.fat).forEach((k,i)=>{
    k.bed=i<S.beds;
    k.fat=Math.max(0,k.fat-(k.bed?C.fatBed:C.fatFloor)*dt);
    if(k.bed&&S.restLv>=2)k.ow=Math.max(0,k.ow-C.owRest2*dt);
  });
  for(const k of [...S.keepers]){
    if(S.t>=k.payAt){S.gold-=k.wage;k.payAt+=24;}
    if(k.state==='vac')continue;
    if(k.ow>=100){k.ow=100;if(k.resignAt==null){k.resignAt=S.t+C.resignWait;log(`⚠️ ${k.name} 과로 MAX — 24시간 안에 휴가를 보내지 않으면 퇴사`);}}
    else if(k.resignAt!=null)k.resignAt=null;
    if(k.resignAt!=null&&S.t>=k.resignAt){S.keepers.splice(S.keepers.indexOf(k),1);reslot();log(`💔 ${k.name} 과로로 퇴사했습니다`);}
  }
  // 담당 배정: 근무 중 직원이 최대 2개 사육장, 특화 환경 우선
  const duty=S.keepers.filter(k=>k.state==='work');const load=new Map(duty.map(k=>[k.id,0]));
  S.enc.forEach(e=>e.cover=null);
  const need=S.enc.filter(e=>e.an.length);
  for(const e of need)for(const k of duty)if(k.spec===e.hab&&load.get(k.id)<C.perKeeper){e.cover=k.id;load.set(k.id,load.get(k.id)+1);break;}
  for(const e of need)if(!e.cover)for(const k of [...duty].sort((a,b)=>(a.spec?1:0)-(b.spec?1:0)))if(load.get(k.id)<C.perKeeper){e.cover=k.id;load.set(k.id,load.get(k.id)+1);break;}
  // 수익
  const epic=epicBonus(), ev=S.event&&S.t<S.event.until;
  let tot=0;
  for(const e of S.enc){
    const k=e.cover&&S.keepers.find(k=>k.id===e.cover);
    e.mg=k?(k.spec===e.hab?C.mgSpec:C.mgNorm):(e.careUntil>S.t?C.mgNorm:C.mgGap);
    const base=e.an.reduce((s,aid)=>s+SP[S.an[aid].sp].inc,0);
    e.evOn=ev&&e.an.length>=2;
    e.incH=base*(e.mg+epic+(e.evOn?0.5:0));
    tot+=e.incH;
  }
  S.incomeH=tot;S.gold+=tot*dt;
  // 보호소 체류시간
  for(const aid of [...S.shelter]){
    const a=S.an[aid];a.remain-=dt;
    if(a.remain<=0){S.shelter.splice(S.shelter.indexOf(aid),1);delete S.an[aid];log(`🏃 보호소의 ${SP[a.sp].n}이(가) 기간 만료로 탈출했습니다 (도감 기록은 유지)`);}
  }
  // 돌발 이벤트: 단체 관광객
  if(S.event&&S.t>=S.event.until){S.event=null;}
  if(!S.event&&Math.random()<0.04*dt&&S.enc.some(e=>e.an.length>=2)){S.event={until:S.t+3};log('🚌 단체 관광객 방문! 3시간 동안 2마리 이상 사육장 수익 +50%');}
  const day=Math.floor(S.t/24);if(S.candDay!==day){S.candDay=day;genCands();}
}
function advance(h){while(h>1e-9){const d=Math.min(h,0.05);tick(d);h-=d;}}
function epicBonus(){let b=0;for(const e of S.enc)for(const aid of e.an){const s=SP[S.an[aid].sp];if(s.epic)b=Math.max(b,s.epic);}return b}
function wagesH(){return S.keepers.reduce((s,k)=>s+k.wage,0)/24}
function genCands(){
  const used=new Set(S.keepers.map(k=>k.name));const pool=NAMES.filter(n=>!used.has(n));
  S.cands=[0,1,2].map(()=>{const name=pool.splice(Math.floor(Math.random()*pool.length),1)[0]||'신입';const r=Math.random();const spec=r<0.4?null:['grass','forest','water'][Math.floor(Math.random()*3)];return {name,spec,fee:spec?200:120}});
}

// ───────────────────────── 행동 ─────────────────────────
function say(m){ui.msg=m;log(m)}
function canSpend(c){return S.gold>=0&&S.gold>=c}
function spend(c){if(!canSpend(c)){say(S.gold<0?'잔고가 마이너스라 구매할 수 없습니다':'골드가 부족합니다');return false}S.gold-=c;return true}
function detach(a){
  if(a.loc==='enc'){const e=S.enc.find(e=>e.id===a.enc);e.an.splice(e.an.indexOf(a.id),1);a.enc=null;}
  else if(a.loc==='shelter')S.shelter.splice(S.shelter.indexOf(a.id),1);
  else if(a.loc==='pending')S.pending.splice(S.pending.indexOf(a.id),1);
}
// 03-05 배치 판정 순서: 보유 → 환경 → 수용량 → 배치
function placeCheck(a,e){
  if(!a||!S.an[a.id])return '보유하지 않은 개체';
  if(e.hab!==SP[a.sp].hab)return `필요 환경: ${HAB[SP[a.sp].hab].n}`;
  if(e.an.length>=e.cap&&a.enc!==e.id)return '수용량 부족';
  return null;
}
const A={
  tab:d=>{tab=d.v;ui.sel=null},
  speed:d=>{S.speed=+d.v},
  skip:d=>{advance(+d.v);say(`⏩ ${d.v}시간 경과 시뮬레이션 완료`)},
  sel:d=>{ui.sel=ui.sel===+d.v?null:+d.v},
  place:d=>{const a=S.an[+d.a],e=S.enc.find(e=>e.id===+d.e);const err=placeCheck(a,e);if(err)return say('배치 불가 — '+err);
    detach(a);a.loc='enc';a.enc=e.id;e.an.push(a.id);say(`${SP[a.sp].e} ${SP[a.sp].n} → ${HAB[e.hab].n} 사육장 #${e.id} 배치`);ui.sel=null},
  shelter:d=>{const a=S.an[+d.a];if(S.shelter.length>=S.shelterCap)return say('보호소가 가득 찼습니다');
    detach(a);a.loc='shelter';S.shelter.push(a.id);say(`${SP[a.sp].n} 보호소 입소 (남은 체류 ${fmtH(a.remain)})`);ui.sel=null},
  adopt:d=>{const a=S.an[+d.a];const s=SP[a.sp];const key='adopt'+a.id;
    if(s.epic&&ui.confirm!==key){ui.confirm=key;return}
    ui.confirm=null;detach(a);delete S.an[a.id];const p=adoptPrice(a);S.gold+=p;say(`🤝 ${s.n} 분양 +${p}골드`);ui.sel=null},
  care:d=>{const e=S.enc.find(e=>e.id===+d.e);e.careUntil=S.t+C.careHours;say(`🧹 사육장 #${e.id} 직접 돌봄 — ${C.careHours}시간 동안 일반 관리`)},
  expand:d=>{const e=S.enc.find(e=>e.id===+d.e);const c=150*(e.cap-2);if(e.cap>=6)return;if(spend(c)){e.cap++;say(`사육장 #${e.id} 수용량 ${e.cap}`)}},
  build:d=>{const h=d.v;if(S.enc.length>=SLOTS.length)return say('부지가 가득 찼습니다');if(spend(HAB[h].build)){S.enc.push(mkEnc(h));say(`${HAB[h].i} ${HAB[h].n} 사육장 건설`)}},
  hire:d=>{const c=S.cands[+d.v];if(!c)return;if(S.keepers.length>=S.hireCap)return say('고용 상한 도달 — 직원 숙소를 증축하세요');
    if(spend(c.fee)){S.keepers.push(mkKeeper(c.name,c.spec));S.cands.splice(+d.v,1);reslot();say(`👋 ${c.name} 고용 (${c.spec?HAB[c.spec].n+' 특화':'일반'})`)}},
  fire:d=>{const k=S.keepers.find(k=>k.id===+d.v);const key='fire'+k.id;if(ui.confirm!==key){ui.confirm=key;return}ui.confirm=null;
    const frac=Math.min(1,Math.max(0,(S.t-(k.payAt-24))/24));const pay=Math.round(k.wage*frac);S.gold-=pay;
    S.keepers.splice(S.keepers.indexOf(k),1);reslot();say(`${k.name} 해고 — 정산 급여 ${pay}골드`)},
  vac:d=>{const k=S.keepers.find(k=>k.id===+d.v);k.state='vac';k.vacUntil=S.t+C.vacation;k.resignAt=null;k.forced=false;say(`🏖️ ${k.name} 24시간 휴가 (복귀 시 과로 0)`)},
  shift:d=>{S.shift=+d.v;reslot();say(`교대 방식: ${S.shift}교대 (${24/S.shift}시간 근무)`)},
  upg:d=>{const u=UPG.find(u=>u.id===d.v);if(!u.can())return;if(spend(u.cost())){u.f();say('🔧 '+u.n+' 완료')}},
  sup:d=>{const s=SUP.find(s=>s.k===d.v);if(spend(s.cost)){S.inv[s.k]+=s.q;say(`${s.n} 구매`)}},
  explore:()=>startExp(),
  reset:()=>{if(ui.confirm!=='reset'){ui.confirm='reset';return}ui.confirm=null;try{localStorage.removeItem(SAVE_KEY)}catch(e){}newGame();tab='zoo'},
};
const UPG=[
  {id:'hire',n:'직원 숙소 증축',d:()=>`고용 상한 ${S.hireCap} → ${S.hireCap+1}명`,cost:()=>300*(S.hireCap-1),can:()=>S.hireCap<6,f:()=>S.hireCap++},
  {id:'bed',n:'휴게실 침상 추가',d:()=>`침상 ${S.beds} → ${S.beds+1}개`,cost:()=>150+100*S.beds,can:()=>S.beds<5,f:()=>S.beds++},
  {id:'rest2',n:'안락 휴게실 (Lv2)',d:()=>'침상에서 쉬는 동안 과로 −1/h',cost:()=>600,can:()=>S.restLv<2,f:()=>S.restLv=2},
  {id:'shelter',n:'보호소 확장',d:()=>`수용 ${S.shelterCap} → ${S.shelterCap===5?10:20}마리`,cost:()=>S.shelterCap===5?300:800,can:()=>S.shelterCap<20,f:()=>S.shelterCap=S.shelterCap===5?10:20},
  {id:'transport',n:'수송 우리 추가',d:()=>`탐험 수송량 ${S.transport} → ${S.transport+1}마리`,cost:()=>400*(S.transport-2),can:()=>S.transport<5,f:()=>S.transport++},
  {id:'rope',n:'포획끈 강화',d:()=>`Lv${S.rope+1}→${S.rope+2}: 1m당 HP ${C.ropePow[S.rope]}→${C.ropePow[S.rope+1]}, 내구도 ${C.ropeDur[S.rope]}→${C.ropeDur[S.rope+1]}`,cost:()=>[300,700][S.rope],can:()=>S.rope<2,f:()=>S.rope++},
];
const SUP=[{k:'dart',n:'마취탄 3발',cost:30,q:3},{k:'trap',n:'덫 1개',cost:20,q:1},{k:'food',n:'먹이 3개',cost:15,q:3}];

// ───────────────────────── 렌더링 (동물원 UI) — 이모지 없이, 3D 초상과 색 역할로 구분 ─────────────────────────
const $=s=>document.getElementById(s);
const HCOL={grass:'var(--grass)',forest:'var(--forest)',water:'var(--water)'};
const sw=h=>`<i class="sw" style="background:${HCOL[h]}"></i>`;
const aImg=sp=>{const u=portraitAnimal(sp);return u?`<img src="${u}" alt="${SP[sp].n}">`:`<span class="ph">${SP[sp].n[0]}</span>`};
const kImg=(n,s)=>{const u=portraitKeeper(n,s);return u?`<img src="${u}" alt="${n}">`:`<span class="ph">${n[0]}</span>`};
const isGap=e=>e.an.length&&e.mg===C.mgGap;
function alertsList(){
  const out=[];
  const gaps=S.enc.filter(isGap).length;
  if(gaps)out.push(['danger-t',`관리 공백 ${gaps}곳 — 수익 30%`,'staff']);
  S.keepers.filter(k=>k.resignAt!=null).forEach(k=>out.push(['danger-t',`${k.name} 사직 예정 · ${fmtH(k.resignAt-S.t)} 남음`,'staff']));
  const soon=S.shelter.filter(i=>S.an[i].remain<3).length;
  if(soon)out.push(['danger-t',`보호소 만료 임박 ${soon}마리`,'shelter']);
  const noBed=S.keepers.filter(k=>k.state==='rest'&&!k.bed).length;
  if(noBed)out.push(['calm-t',`침상 부족 — ${noBed}명 대기 중`,'staff']);
  if(S.gold<0)out.push(['danger-t','잔고 부족 — 구매·고용·탐험 불가','invest']);
  if(S.event&&S.t<S.event.until)out.push(['gold',`단체 관광객 방문 중 · ${fmtH(S.event.until-S.t)}`,'zoo']);
  return out;
}
function renderTop(){
  const net=S.incomeH-wagesH();
  $('top').innerHTML=`<div class="brand"><b>PROJECT Z</b><small>이세계 동물원 운영 프로토타입</small></div>
   <div class="metric"><small>보유 골드</small><b class="gold">${g(S.gold)} G</b></div>
   <div class="metric"><small>시간당 순수익</small><b class="${net<0?'danger-t':''}">${net>=0?'+':''}${net.toFixed(1)}</b></div>
   <div class="metric"><small>운영 시간</small><b>${clock()}</b></div>
   <div class="row"><div class="seg">${[[0,'정지'],[1,'×1'],[5,'×5'],[20,'×20']].map(([v,n])=>`<button class="${S.speed===v?'on':''}" data-a="speed" data-v="${v}">${n}</button>`).join('')}</div>
     <button class="sm" data-a="skip" data-v="12" title="12시간 경과를 한 번에 정산 (오프라인 테스트)">12시간 건너뛰기</button></div>
   <span class="grow"></span>
   <button class="pri" data-a="explore" ${S.pending.length||S.gold<0?'disabled':''}>탐험 출발</button>`;
  $('status').innerHTML=alertsList().map(([c,t,tb])=>`<a class="${c}" data-a="tab" data-v="${tb}">${t}</a>`).join('');
  const tb=[['zoo','동물원',S.enc.filter(isGap).length],['staff','사육사',S.keepers.filter(k=>k.resignAt!=null).length],['shelter','보호소',S.shelter.filter(i=>S.an[i].remain<3).length],['invest','시설·장비',0],['codex','동물도감',0]];
  $('tabs').innerHTML=tb.map(([k,n,b])=>`<button class="${tab===k?'on':''}" data-a="tab" data-v="${k}">${n}${b?`<span class="cnt">${b}</span>`:''}</button>`).join('')+'<div class="ver">PLAYTEST v0.1</div>';
  $('log').innerHTML=S.log.slice(0,3).map(l=>`<div>${l}</div>`).join('');
}
function encState(e){
  if(!e.an.length)return '<div class="state meta">비어 있음</div>';
  const k=e.cover&&S.keepers.find(k=>k.id===e.cover);
  const ev=e.evOn?' <span class="gold">· 관광객 +50%</span>':'';
  if(e.mg===C.mgSpec)return `<div class="state good-t">특화 관리 120% · ${k.name}${ev}</div>`;
  if(k)return `<div class="state">일반 관리 100% · ${k.name}${ev}</div>`;
  if(e.careUntil>S.t)return `<div class="state calm-t">직접 돌봄 100% · ${fmtH(e.careUntil-S.t)} 남음${ev}</div>`;
  return `<div class="state danger-t">관리 공백 30% · 담당 사육사 없음${ev}</div>`;
}
function animalActions(a){
  const s=SP[a.sp];
  const encBtns=S.enc.filter(e=>e.id!==a.enc).map(e=>{const err=placeCheck(a,e);return `<button class="sm" data-a="place" data-a-id="${a.id}" data-e="${e.id}" ${err?`disabled title="${err}"`:''}>${HAB[e.hab].n} #${e.id}로</button>`}).join('');
  const fits=S.enc.some(e=>e.id!==a.enc&&!placeCheck(a,e));
  const conf=ui.confirm==='adopt'+a.id;
  return `<div class="row">${encBtns}
    ${!fits&&a.loc!=='enc'?`<span class="meta">빈 ${HAB[s.hab].n} 사육장 없음</span>`:''}
    ${a.loc!=='shelter'?`<button class="sm" data-a="shelter" data-a-id="${a.id}" ${S.shelter.length>=S.shelterCap?'disabled title="보호소가 가득 찼습니다"':''}>보호소</button>`:''}
    <button class="sm ${conf?'danger':''}" data-a="adopt" data-a-id="${a.id}">${conf?'에픽 개체입니다 — 분양 확정':`분양 <span class="money">+${adoptPrice(a)} G</span>`}</button></div>`;
}
function animalInfo(s){return `<b>${s.n}</b>${s.epic?'<span class="tag gold">에픽</span>':''}${s.mon?'<span class="tag meta">몬스터</span>':''}
   <div class="meta row" style="gap:6px;margin-top:2px">${sw(s.hab)}${HAB[s.hab].n} · 기본 ${s.inc} G/시간 · ${PERS[s.p]}${s.epic?` · 배치하면 동물원 전체 수익 +${s.epic*100}%`:''}</div>`}
function animalLine(a,extra=''){
  return `<div class="item"><div class="pic">${aImg(a.sp)}</div><div class="txt">${animalInfo(SP[a.sp])}${extra}</div>${animalActions(a)}</div>`;
}
function renderZoo(){
  let h='';
  if(ui.sel&&S.an[ui.sel]){const a=S.an[ui.sel];h+=`<div class="detail"><div class="pic">${aImg(a.sp)}</div><div class="txt" style="flex:1;min-width:180px">${animalInfo(SP[a.sp])}</div>${animalActions(a)}</div>`;}
  const epic=epicBonus();
  h+=`<div class="sec"><h2>사육장</h2><span class="meta">부지 ${S.enc.length}/${SLOTS.length} · 시간당 수익 = 기본 합계 × (관리 배율${epic?` + 에픽 ${epic*100}%`:''} + 이벤트)</span></div><div class="grid">`;
  for(const e of S.enc){
    h+=`<div class="card ${ui.selEnc===e.id?'picked':''}" id="enc-card-${e.id}">
      <div class="row"><h3>${sw(e.hab)}${HAB[e.hab].n} 사육장 #${e.id}</h3><span class="grow"></span><span class="meta num">${e.an.length} / ${e.cap}</span></div>
      ${encState(e)}
      <div class="thumbs">${e.an.map(aid=>`<button class="thumb ${ui.sel===aid?'sel':''}" data-a="sel" data-v="${aid}" title="${SP[S.an[aid].sp].n}">${aImg(S.an[aid].sp)}</button>`).join('')}${'<span class="thumb empty"></span>'.repeat(e.cap-e.an.length)}</div>
      <div class="foot"><span class="money">+${e.incH.toFixed(1)} G</span><span class="meta">/ 시간</span><span class="grow"></span>
       ${isGap(e)?`<button class="sm" data-a="care" data-e="${e.id}">직접 돌봄</button>`:''}
       ${e.cap<6?`<button class="sm" data-a="expand" data-e="${e.id}" ${canSpend(150*(e.cap-2))?'':'disabled'}>수용 +1 · ${150*(e.cap-2)} G</button>`:''}</div></div>`;
  }
  const full=S.enc.length>=SLOTS.length;
  h+=`<div class="card ghost" id="build-card"><h3>새 사육장</h3><div class="meta" style="margin:4px 0 12px">${full?'부지가 가득 찼습니다.':'환경이 맞는 개체만 배치할 수 있습니다.'}</div><div class="row">
    ${Object.entries(HAB).map(([k,v])=>`<button class="sm" data-a="build" data-v="${k}" ${canSpend(v.build)&&!full?'':'disabled'}><span class="row" style="gap:6px">${sw(k)}${v.n} · ${v.build} G</span></button>`).join('')}</div></div></div>`;
  return h;
}
function bar(v,col){return `<div class="bar"><i style="width:${Math.min(100,Math.max(0,v))}%;background:${col}"></i></div>`}
function keeperState(k){
  if(k.state==='vac')return `<span class="calm-t">휴가 중 · ${fmtH(k.vacUntil-S.t)} 후 복귀</span>`;
  if(k.state==='work')return '<span class="good-t">근무 중</span>';
  if(k.forced)return '<span class="danger-t">탈진 — 강제 휴식</span>';
  return k.bed?'<span>침상에서 휴식</span>':'<span class="calm-t">침상이 없어 대기</span>';
}

  const L=24/S.shift,cur=Math.floor((S.t%24)/L);

      <div class="meta row" style="gap:6px">${k.spec?`${sw(k.spec)}${HAB[k.spec].n} 특화 · 120%`:'일반 사육사'} · 일급 ${k.wage} G</div>
      <div class="state">${keeperState(k)}</div>

       <span>과로</span>${bar(k.ow,'var(--danger)')}<span>${Math.round(k.ow)}</span></div>
      ${k.resignAt!=null?`<div class="state danger-t">${fmtH(k.resignAt-S.t)} 뒤 사직 — 휴가를 보내세요</div>`:''}
      <div class="foot" style="margin-top:8px"><span class="meta grow">${k.state==='work'?(covers?`담당 ${covers}`:'담당 없음')+` · 연속 ${k.sh.toFixed(1)}시간`:`다음 급여 ${fmtH(k.payAt-S.t)}`}</span>
       ${k.state!=='vac'?`<button class="sm" data-a="vac" data-v="${k.id}">휴가</button>`:''}
       <button class="sm ${fc?'danger':''}" data-a="fire" data-v="${k.id}">${fc?'해고 확정':'해고'}</button></div></div></div>`;
  }
  h+=`</div><div class="sec" style="margin-top:28px"><h2>고용 후보</h2><span class="meta">매일 바뀝니다</span></div><div class="list">`;
  S.cands.forEach((c,i)=>{h+=`<div class="item"><div class="pic">${kImg(c.name,c.spec)}</div><div class="txt"><b>${c.name}</b><div class="meta row" style="gap:6px">${c.spec?`${sw(c.spec)}${HAB[c.spec].n} 특화 · 일급 70 G`:'일반 · 일급 50 G'}</div></div>
     <button class="sm" data-a="hire" data-v="${i}" ${S.keepers.length>=S.hireCap||!canSpend(c.fee)?'disabled':''}>고용 · ${c.fee} G</button></div>`});
  if(S.keepers.length>=S.hireCap)h+=`<div class="meta">고용 상한에 도달했습니다. 시설·장비에서 직원 숙소를 증축하세요.</div>`;
  return h+'</div>';
}
function renderShelter(){
  let h=`<div class="sec"><h2>보호소</h2><span class="meta">${S.shelter.length} / ${S.shelterCap}마리 · 입소 ${C.shelterHours}시간 뒤 탈출 · 보관 중에는 수익과 에픽 효과가 없습니다</span></div><div class="list">`;
  const list=[...S.shelter].sort((a,b)=>S.an[a].remain-S.an[b].remain);
  if(!list.length)h+='<div class="meta">보관 중인 개체가 없습니다.</div>';
  for(const aid of list){const a=S.an[aid],low=a.remain<3;
    h+=animalLine(a,`<div class="row" style="margin-top:8px;max-width:320px"><span class="${low?'danger-t':'calm-t'} num" style="font-size:12.5px;font-weight:600;min-width:72px">${fmtH(a.remain)} 남음</span>${bar(a.remain/C.shelterHours*100,low?'var(--danger)':'var(--calm)')}</div>`);}
  return h+'</div>';
}
function renderInvest(){
  let h=`<div class="sec"><h2>시설 투자</h2></div><div class="list">`;

const W=1000,H=560;
const MAP={truck:{x:80,y:150},caves:[{x:940,y:60,r:36},{x:50,y:520,r:36}],pond:{x:740,y:430,rx:150,ry:85,deep:42},
  forest:[{x:800,y:150,r:150},{x:640,y:90,r:90}]};
function escapes(a){const p=MAP.pond;const deep={x:p.x,y:p.y,r:p.deep,k:'깊은 물'};
  if(SP[a.sp].p==='hide')return deep;
  return [...MAP.caves.map(c=>({...c,k:'동굴'})),deep].sort((u,v)=>dist(a,u)-dist(a,v))[0];}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function wpick(){const e=Object.entries(SP).filter(([,s])=>s.w);const tot=e.reduce((s,[,v])=>s+v.w,0);let r=Math.random()*tot;for(const [k,v] of e){if((r-=v.w)<0)return k}return 'bunny'}
function spawnPos(hab){
  for(let i=0;i<40;i++){let x,y;
    if(hab==='forest'){x=560+Math.random()*380;y=70+Math.random()*230}
    else if(hab==='water'){const t=Math.random()*Math.PI*2;x=MAP.pond.x+Math.cos(t)*(MAP.pond.rx+40+Math.random()*50);y=MAP.pond.y+Math.sin(t)*(MAP.pond.ry+30+Math.random()*40)}
    else {x=220+Math.random()*380;y=90+Math.random()*400}
    x=Math.max(30,Math.min(W-30,x));y=Math.max(30,Math.min(H-30,y));
    const p={x,y};
    if(MAP.caves.every(c=>dist(p,c)>170)&&dist(p,MAP.pond)>MAP.pond.deep+140&&dist(p,MAP.truck)>140)return p;}
  return {x:400,y:280};
}

  S.expCount++;

      S.codex[sp]=S.codex[sp]||{seen:0,caught:0};S.codex[sp].seen++;
      return {sp,s,x:p.x,y:p.y,hp:s.hp,st:'calm',stun:0,stunMax:0,darts:0,trap:0,tx:p.x,ty:p.y,wt:0,gone:false}}),
    foods:[],traps:[],rope:null,dur:0,tow:null,captured:[],lost:0,fx:[],tool:'dart',hint:'① 💉 마취총으로 개체를 터치해 기절시키세요',ended:false,endIn:0};

  mode='exp';$('exp').classList.add('show');resize();newExp3D();renderExpUI();
}
function fx(x,y,t,c='#fff'){X.fx.push({x,y,t:noEmo(t),c,life:1.2})}
function hitAnimal(p,r=46){let best=null,bd=r;for(const a of X.animals){if(a.gone)continue;const d=dist(a,p);if(d<bd){bd=d;best=a}}return best}
function alarmNear(p,r){for(const a of X.animals)if(!a.gone&&a.st==='calm'&&a.stun<=0&&dist(a,p)<r&&(a.s.p==='flee'||a.s.p==='hide')){a.st='alarm';fx(a.x,a.y-30,'!','#ff6b5b')}}
function useTool(p){
  const t=X.tool;
  if(t==='food'){if(S.inv.food<=0)return flash('먹이가 없습니다');S.inv.food--;X.foods.push({x:p.x,y:p.y,life:10});fx(p.x,p.y-20,'🥕 유인','#ffe08a');}
  else if(t==='trap'){if(S.inv.trap<=0)return flash('덫이 없습니다');S.inv.trap--;X.traps.push({x:p.x,y:p.y});fx(p.x,p.y-20,'덫 설치','#ddd');}
  else if(t==='dart'){

    const eating=a.st==='calm'&&X.foods.some(f=>dist(a,f)<18);

    fx(a.x,a.y-34,`${eating?'배부름! ':''}기절 ${a.stunMax.toFixed(1)}초`,'#8fd3ff');alarmNear(a,220);
    if(X.rope!==a){X.tool='rope';X.hint='② 🪢 포획끈으로 기절한 개체를 터치해 연결하세요';}
  }
  else if(t==='rope'){
    const a=hitAnimal(p);if(!a)return flash('연결할 개체를 터치하세요');
    if(a.stun<=0&&a.trap<=0)return flash('기절했거나 덫에 걸린 개체만 묶을 수 있습니다');
    X.rope=a;X.dur=C.ropeDur[S.rope];fx(a.x,a.y-34,'끈 연결!','#ffd27a');
    X.hint='③ 화면을 드래그해 끌어당기세요 — 끈 1m당 HP가 줄고 0이 되면 포획';

function flash(m){X.hint=m;renderExpUI()}
function moveTo(a,tx,ty,sp,dt){const dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy);if(d<4)return 0;const m=Math.min(d,sp*dt);a.x+=dx/d*m;a.y+=dy/d*m;a.x=Math.max(12,Math.min(W-12,a.x));a.y=Math.max(12,Math.min(H-12,a.y));return m}
function updateExp(dt){
  for(const f of X.foods)f.life-=dt;X.foods=X.foods.filter(f=>f.life>0);
  for(const f of X.fx){f.life-=dt;f.y-=20*dt}X.fx=X.fx.filter(f=>f.life>0);
  for(const a of X.animals){
    if(a.gone)continue;const s=a.s;
    if(a.stun>0){a.stun-=dt;if(a.stun<=0){a.stun=0;a.st='alarm';fx(a.x,a.y-34,'깨어남!','#ff9b6b');if(X.rope===a)X.hint='묶인 채 깨어나 몸부림칩니다 — 계속 끌거나 재마취하세요';}}
    if(a.trap>0){a.trap-=dt;if(a.trap<0)a.trap=0;}
    const imm=a.stun>0||a.trap>0;
    if(X.rope===a){
      if(X.tow){const tg=X.tow.auto?MAP.truck:X.tow;
        const sp=C.towSpd[S.rope]*(imm?1:(s.p==='strong'?C.awakeTowStrong:C.awakeTow));
        let m=moveTo(a,tg.x,tg.y,sp,dt);
        // 트럭에 도착해도 견인은 계속(우리로 끌어넣기) → 도착 지점에서 HP 감소가 멈추는 막힘 방지
        if(m===0&&dist(a,MAP.truck)<48)m=sp*dt;
        a.hp-=m/20*C.ropePow[S.rope];a.dmgAcc=(a.dmgAcc||0)+m/20*C.ropePow[S.rope];
        if(a.dmgAcc>=10){fx(a.x+18,a.y-20,'-'+Math.round(a.dmgAcc),'#ffd27a');a.dmgAcc=0;}}
      else if(!imm){const e=escapes(a);moveTo(a,e.x,e.y,s.spd*0.35,dt);}
      if(!imm){X.dur-=C.ropeDrain*(s.p==='strong'?2:1)*(s.epic?1.5:1)*dt;
        if(X.dur<=0){X.rope=null;X.tow=null;a.st='alarm';fx(a.x,a.y-34,'끈이 끊어졌다!','#ff6b5b');X.hint='끈이 끊어졌습니다! 탈출 전에 다시 마취하세요';X.tool='dart';renderExpUI();}}
    }else if(!imm){
      if(a.st==='alarm'){const e=escapes(a);moveTo(a,e.x,e.y,s.spd*(s.p==='hide'?1.3:1),dt);}
      else{
        const fr=s.p==='food'?300:120;let food=null,fd=fr;for(const f of X.foods){const d=dist(a,f);if(d<fd){fd=d;food=f}}
        if(food){if(fd>14)moveTo(a,food.x,food.y,s.spd*0.8,dt);}
        else{a.wt-=dt;if(a.wt<=0||dist(a,{x:a.tx,y:a.ty})<5){a.wt=2+Math.random()*3;const p=spawnPos(s.hab);a.tx=a.x+(p.x-a.x)*0.3;a.ty=a.y+(p.y-a.y)*0.3;}moveTo(a,a.tx,a.ty,s.spd*0.35,dt);}
      }
    }
    // 덫 판정
    if(a.stun<=0&&a.trap<=0)for(const t of X.traps){if(dist(a,t)<22){t.used=true;a.hp=Math.max(1,a.hp-C.trapDmg);a.trap=C.trapHold;a.st='alarm';fx(a.x,a.y-34,`덫! -${C.trapDmg}`,'#ff9b6b');alarmNear(a,200);break;}}
    X.traps=X.traps.filter(t=>!t.used);
    // 판정 우선순위: HP 0 > 탈출 > (깨어남은 위에서 처리)
    if(a.hp<=0){a.gone=true;if(X.rope===a){X.rope=null;X.tow=null;}
      X.captured.push(a.sp);S.codex[a.sp].caught++;fx(a.x,a.y-30,'포획 성공! 🎉','#9dffa8');
      X.hint=`포획! 수송 ${X.captured.length}/${S.transport}`;X.tool='dart';
      if(X.captured.length>=S.transport){X.hint='수송 공간이 가득 찼습니다 — 귀환합니다';X.endIn=1.5;}
      renderExpUI();continue;}
    if(!imm&&a.st==='alarm'){const e=escapes(a);if(dist(a,e)<e.r){a.gone=true;X.lost++;if(X.rope===a){X.rope=null;X.tow=null;}fx(a.x,a.y-30,`${e.k}(으)로 도망쳤다…`,'#ff6b5b');X.hint=`${a.s.n}을(를) 놓쳤습니다 — 이번 탐험에서는 다시 나타나지 않습니다`;X.tool='dart';renderExpUI();}}
  }

}

  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

      if(mine.length){const [,j]=mine[Math.floor(t/6)%mine.length];const [x,z]=SLOTS[j];o.tx=x-.8+(i%3)*.8;o.tz=z+(z<0?PEN_D/2+.45:-PEN_D/2-.45);}

    else if(k.state==='rest'&&k.bed){o.tx=BLD.rest.x-1.35;o.tz=BLD.rest.z;hideAtDoor=true;}
    else{o.tx=BENCH.x-.55+bench*.55;o.tz=BENCH.z;bench++;sitHere=true;}
    const px=o.x,pz=o.z,mv=moveObj(o,dt*Math.min(Math.max(S.speed,1),5),2.2);
    if(mv)o.yaw=lerpAng(o.yaw,Math.atan2(o.x-px,o.z-pz),.25);else if(sitHere)o.yaw=lerpAng(o.yaw,0,.2);
    o.inside=hideAtDoor&&!mv;if(o.inside)inside++;
    o.m.visible=k.state!=='vac'&&!o.inside;
    o.m.rotation.y=o.yaw;o.m.position.set(o.x,sitHere&&!mv?.12:0,o.z);
    animPerson(o.m,t,{moving:mv,sit:sitHere&&!mv,carry:k.state==='work'});o.k=k;});
  for(const [id,o] of Z.kp)if(!kseen.has(id)){Z.scene.remove(o.m);Z.kp.delete(id);}
  Z.inside=inside;
  // 단체 관광객
  const ev=S.event&&S.t<S.event.until;
  if(ev&&!Z.tour.length)for(let i=0;i<4;i++){const m=buildVisitor(i);m.scale.multiplyScalar(.85);Z.scene.add(m);Z.tour.push({m,x:0.4+i*.5,z:5.4,tx:-9,tz:PATH_Z,dir:-1,yaw:Math.PI});}
  if(!ev&&Z.tour.length){Z.tour.forEach(o=>Z.scene.remove(o.m));Z.tour=[];}
  Z.tour.forEach((o,i)=>{const px=o.x,pz=o.z;if(!moveObj(o,dt,1.1)){o.dir*=-1;o.tx=o.dir<0?-9+i*.4:6.5-i*.4;o.tz=PATH_Z+(i%2?.3:-.3);}
    o.yaw=lerpAng(o.yaw,Math.atan2(o.x-px,o.z-pz),.2);o.m.rotation.y=o.yaw;o.m.position.set(o.x,0,o.z);animPerson(o.m,t,{moving:true});});
  // 수익 연출: 금색 = 돈 (공백 사육장은 흐린 붉은색)
  Z.coinT+=dt;if(Z.coinT>2.5){Z.coinT=0;if(S.speed>0)S.enc.forEach((e,i)=>{if(i<SLOTS.length&&e.incH>0){const gain=e.incH*2.5*S.speed/C.real1h;Z.fx.push({x:SLOTS[i][0],z:SLOTS[i][1]+.5,h:.9,t:`+${gain<1?gain.toFixed(1):Math.round(gain)} G`,life:1.6,c:e.mg===C.mgGap?'#f2a497':'#f6c453'})}});}
  for(const f of Z.fx){f.life-=dt;f.h+=dt*.5;}Z.fx=Z.fx.filter(f=>f.life>0);
  Z.renderer.render(Z.scene,Z.camera);
  // ── 오버레이 라벨 (짧게: 번호 + 상태)
  const d2=zov.width/zw,o=zctx;o.setTransform(d2,0,0,d2,0,0);o.clearRect(0,0,zw,zh);o.textAlign='center';o.textBaseline='middle';
  const FONT='600 12px Pretendard, "Malgun Gothic", sans-serif';
  const tag=(x,h,z,txt,bg,fg='#fff')=>{const q=zscr(x,h,z);o.font=FONT;const w2=o.measureText(txt).width+14;
    o.fillStyle=bg;o.beginPath();if(o.roundRect)o.roundRect(q.x-w2/2,q.y-10,w2,20,4);else o.rect(q.x-w2/2,q.y-10,w2,20);o.fill();o.fillStyle=fg;o.fillText(txt,q.x,q.y+.5);};
  const INKBG='rgba(31,42,36,.82)';
  S.enc.forEach((e,i)=>{if(i>=SLOTS.length)return;const [x,z]=SLOTS[i];
    const gap=isGap(e),st=!e.an.length?'비어 있음':gap?'관리 공백':e.mg===C.mgSpec?'특화 관리':e.careUntil>S.t&&!e.cover?'직접 돌봄':'관리 중';
    const bg=gap?'rgba(196,81,59,.95)':e.mg===C.mgSpec?'rgba(47,107,79,.95)':INKBG;
    tag(x,.25,z-PEN_D/2-.05,`#${e.id} ${st}`,bg);});
  tag(0.4,2.1,5.5,'정문',INKBG);
  Z.empties.forEach(m=>{if(m.visible)tag(m.position.x,.1,m.position.z,'빈 부지','rgba(248,246,240,.85)','#4b5650');});
  tag(BLD.rest.x,2.45,BLD.rest.z,`휴게실 · 침상 ${Z.inside}/${S.beds}`,INKBG);
  tag(BLD.shelter.x,2.45,BLD.shelter.z,`보호소 ${S.shelter.length}/${S.shelterCap}`,S.shelter.some(i=>S.an[i].remain<3)?'rgba(196,81,59,.95)':INKBG);
  const txt=(x,y,s,col)=>{o.font='600 11px Pretendard, "Malgun Gothic", sans-serif';o.lineWidth=3;o.strokeStyle='rgba(20,26,23,.6)';o.strokeText(s,x,y);o.fillStyle=col;o.fillText(s,x,y);};
  for(const aid of S.shelter){const ob=Z.an.get(aid);if(!ob)continue;const a=S.an[aid];const q=zscr(ob.x,ob.h+.35,ob.z);txt(q.x,q.y,fmtH(a.remain),a.remain<3?'#f2a497':'#cfe6f5');}
  for(const [,ob] of Z.kp){const k=ob.k;if(!k||!ob.m.visible)continue;const q=zscr(ob.x,1.12,ob.z);
    const warn=k.resignAt!=null?' · 사직 예정':k.forced?' · 탈진':'';
    txt(q.x,q.y,k.name+warn,warn?'#f2a497':'#fff');
    const bw=32;o.fillStyle='rgba(20,26,23,.5)';o.fillRect(q.x-bw/2,q.y+8,bw,3);o.fillStyle=k.fat>80?'#e27a64':'#e6ebe5';o.fillRect(q.x-bw/2,q.y+8,bw*k.fat/100,3);
    if(k.ow>0){o.fillStyle='rgba(20,26,23,.5)';o.fillRect(q.x-bw/2,q.y+12,bw,3);o.fillStyle='#e27a64';o.fillRect(q.x-bw/2,q.y+12,bw*k.ow/100,3);}}
  for(const f of Z.fx){const q=zscr(f.x,f.h,f.z);o.globalAlpha=Math.min(1,f.life);o.font='700 13px Pretendard, "Malgun Gothic", sans-serif';o.lineWidth=3;o.strokeStyle='rgba(20,26,23,.5)';o.strokeText(f.t,q.x,q.y);o.fillStyle=f.c;o.fillText(f.t,q.x,q.y);o.globalAlpha=1;}
}
// 클릭: 동물 → 상세, 사육사 → 사육사 탭, 사육장 → 카드 강조, 건물 → 해당 탭, 빈 부지 → 건설 카드
const zray=window.THREE?new THREE.Raycaster():null,zndc=window.THREE?new THREE.Vector2():null;
zcv.addEventListener('click',ev=>{
  if(!Z)return;const r=zcv.getBoundingClientRect();zndc.set((ev.clientX-r.left)/r.width*2-1,-(ev.clientY-r.top)/r.height*2+1);zray.setFromCamera(zndc,Z.camera);
  const actors=[...[...Z.an.values()].map(o=>o.m),...[...Z.kp.values()].filter(o=>o.m.visible).map(o=>o.m)];
  const hs=zray.intersectObjects(actors,true)[0];
  let target=null,hit=null;if(hs){hit=hs.object;while(hit&&hit.userData.aid==null&&hit.userData.keeper==null)hit=hit.parent;}
  if(hit){if(hit.userData.aid!=null){ui.sel=hit.userData.aid;ui.selEnc=null;$('main').scrollTop=0;}else{tab='staff';}}
  else{const hp=zray.intersectObjects(Z.pick.filter(m=>m.visible!==false))[0];
    if(hp){const u=hp.object.userData;
      if(u.encId){ui.selEnc=ui.selEnc===u.encId?null:u.encId;ui.sel=null;target='enc-card-'+u.encId;}
      else if(u.tab){tab=u.tab;}
      else if(u.build){target='build-card';}}}
  ui.pressed=false;render();
  if(target){const el=document.getElementById(target);if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});}
});


// ───────────────────────── 루프 · 저장 ─────────────────────────
let last=performance.now(),uiAcc=0,saveAcc=0;
function loop(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;
  if(mode==='exp'&&X){advance(dt/C.exp1h);updateExp(dt);if(X)drawExp();}
  else{advance(dt*S.speed/C.real1h);if(tab==='zoo')drawZoo(dt);}
  uiAcc+=dt;if(uiAcc>0.25){uiAcc=0;render();if(mode==='exp')renderExpUI();}
  saveAcc+=dt;if(saveAcc>5){saveAcc=0;save();}
  requestAnimationFrame(loop);
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE_KEY);if(s){S=JSON.parse(s);return true}}catch(e){}return false}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
if(!load())newGame();
// 디버그·밸런스 검증용
window.PZ={get S(){return S},get X(){return X},advance,C,newGame:()=>{newGame();render()}};
render();requestAnimationFrame(loop);
</script>
