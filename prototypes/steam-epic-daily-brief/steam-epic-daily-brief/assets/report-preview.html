<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Steam Daily · 게임 브리핑</title>
  <style>

    :root { color-scheme:dark; --bg:#182a38; --panel:#1b3041; --ink:#e4edf4; --sub:#99b1c2; --line:#2c4659; --blue:#66c0f4; --deal:#b9e984; --side:#132735; }
    * { box-sizing:border-box; }

    main { max-width:1440px; margin:auto; padding:28px 28px 50px; }
    h1,h2,h3,h4,p { margin:0; }
    a { color:var(--blue); text-decoration:none; }
    a:hover { color:#fff; }

    h1 { font-size:24px; font-weight:650; letter-spacing:-.04em; color:#fff; }
    .meta,.note,.load-state { font-size:11px; color:var(--sub); }
    .workspace { display:grid; grid-template-columns:190px minmax(0,1fr); gap:26px; align-items:start; padding-top:22px; }
    .sidebar { position:sticky; top:18px; max-height:calc(100dvh - 36px); overflow:auto; scrollbar-width:thin; scrollbar-color:#3d5e74 transparent; padding:0 0 18px; background:linear-gradient(#163447,#142735); }
    .sidebar-title { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:11px; color:#9bb6c7; font-weight:600; padding:13px 10px 8px; margin:0; }
    .tabs { display:flex; flex-direction:column; gap:2px; }
    .tabs .genre-tab { display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:8px 10px; border-left:2px solid transparent; color:#a9c5d6; background:#143044; font-size:12px; line-height:1.4; }
    .tabs .genre-tab:hover { color:#fff; background:#23465d; }
    .tabs .genre-tab[aria-selected="true"] { color:#fff; background:linear-gradient(90deg,#4a9ec2,#357596); border-left-color:#a9e0ff; }
    .icon { width:14px; height:14px; flex:0 0 auto; display:inline-block; vertical-align:-2px; }
    .genre-tab .icon { width:13px; height:13px; opacity:.85; }
    .tag-filter-panel { margin-top:14px; border-top:1px solid #345163; }
    .tag-clear { font-size:10px; color:var(--blue); padding:0; }

    .tag-option:hover,.tag-option:has(input:checked) { background:#25485e; color:#fff; }

    .tag-count { color:#809fb4; font-size:10px; font-variant-numeric:tabular-nums; }
    .tag-options-empty { color:var(--sub); font-size:11px; padding:8px 10px; }
    .filters-toggle { display:none; align-items:center; gap:6px; color:var(--blue); padding:7px 0 0; font-size:12px; }
    .report-content { min-width:0; }

    .type-filters { display:flex; gap:26px; border-bottom:1px solid #345569; }

    .type-filters button[aria-pressed="true"] { color:#fff; border-bottom-color:var(--blue); }
    .free-scope { display:flex; gap:16px; padding-top:12px; }
    .free-scope button { color:#a3bdce; font-size:12px; padding:4px 0; border-bottom:1px solid transparent; }
    .free-scope button[aria-pressed="true"] { color:#e5f5ff; border-bottom-color:var(--blue); }
    .view-info { display:flex; justify-content:space-between; gap:16px; align-items:center; padding:17px 0 0; font-size:12px; color:var(--sub); }
    .view-info strong { color:#dce9f2; font-weight:600; }
    .view-actions { display:flex; align-items:center; gap:12px; }
    .new-only { color:#aacde2; border:1px solid #416079; border-radius:3px; padding:2px 8px; }
    .new-only:hover,.new-only[aria-pressed="true"] { color:#092534; background:#78d5ff; border-color:#78d5ff; }
    .active-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
    .active-tags:empty { display:none; }
    .active-tag { padding:3px 7px; color:#b9e0f8; background:#254b63; border:1px solid #416b86; font-size:11px; }
    #sections>section { margin-top:23px; }
    h2 { display:flex; align-items:center; gap:7px; font-size:18px; font-weight:500; margin-bottom:14px; color:#fff; }
    .category-columns { display:grid; gap:26px; }
    .news-category { min-width:0; margin:0; }
    .category-heading { display:flex; gap:7px; align-items:center; margin:0 0 11px; font-size:13px; font-weight:600; color:#b8d9ed; }
    .category-count { margin-left:auto; font-size:11px; font-weight:400; color:var(--sub); }
    .games { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; align-items:start; }
    .game { min-width:0; background:rgba(9,20,30,.26); }
    .game:hover { background:rgba(31,61,80,.6); }
    .cover { position:relative; min-width:0; }
    .new-ribbon { position:absolute; inset:0 0 auto auto; width:68px; height:68px; overflow:hidden; pointer-events:none; z-index:1; }
    .new-ribbon span { position:absolute; top:13px; right:-21px; width:92px; transform:rotate(45deg); text-align:center; color:#092534; background:#78d5ff; font-size:10px; font-weight:800; line-height:18px; letter-spacing:.06em; box-shadow:0 1px 4px #0006; }
    .image-link { display:block; width:100%; aspect-ratio:460/215; overflow:hidden; background:#10202c; }
    .cover img { display:block; width:100%; height:100%; object-fit:cover; }
    .trailer-preview { position:absolute; inset:0; width:100%; height:100%; background:#080f16; object-fit:contain; pointer-events:none; }
    .trailer-toggle { position:absolute; bottom:8px; right:8px; z-index:2; padding:3px 7px!important; background:rgba(9,25,37,.9); color:#d8edf9!important; font-size:10px!important; }
    .cover[data-preview="loading"] .trailer-toggle { color:#95afbf!important; }
    .cover-failed { padding:15px; color:var(--sub); font-size:11px; }
    .cover>button { color:var(--blue); padding:5px; font-size:11px; }
    .copy { display:grid; gap:8px; min-width:0; padding:11px 12px 14px; }
    .game-title { min-width:0; font-size:14px; font-weight:600; line-height:1.4; }
    .game-title a { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#ecf4fa; }
    .game-title a:hover { color:var(--blue); }
    .price { display:flex; gap:6px 9px; align-items:center; flex-wrap:wrap; font-variant-numeric:tabular-nums; }
    .price-values { display:flex; gap:7px; align-items:baseline; flex-wrap:wrap; }
    .amount { color:#fff; font-size:23px; font-weight:700; line-height:1.25; letter-spacing:-.035em; white-space:nowrap; }
    .original { color:#7e97a9; font-size:10px; white-space:nowrap; }
    .discount { display:inline-flex; align-items:center; padding:4px 7px; color:#c6f279; background:#4c6b22; font-size:18px; font-weight:700; line-height:1.4; white-space:nowrap; }
    .deadline { width:100%; font-size:10px; color:#8da9bb; line-height:1.4; }
    .deadline.urgent { color:#e2b98a; }
    .badges { position:absolute; top:8px; left:8px; display:flex; gap:5px; }
    .badges .badge { padding:2px 6px; color:#e2eff8; background:rgba(9,29,42,.88); font-size:10px; font-weight:500; }
    .description { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; font-size:12px; line-height:1.65; color:#b1c5d3; }
    .badge { font-size:11px; font-weight:400; white-space:nowrap; }
    .metadata { display:flex; flex-wrap:wrap; align-items:center; gap:5px 10px; color:#8da9bb; font-size:11px; }
    .language-supported { padding:0; color:#abd27d; font-weight:600; }
    .language-supported::before { content:'✓'; margin-right:3px; }
    .language-unsupported { color:#8199aa; }
    .review-meta { display:inline-flex; gap:7px; align-items:center; flex-wrap:wrap; }
    .review-meta .review-count { color:inherit; }
    .review-meta .badge-positive { color:#86bbd8; }
    .review-meta .badge-mixed { color:#bda678; }
    .review-meta .badge-negative { color:#bf9b90; }
    .steam-tags { display:flex; flex-wrap:wrap; gap:4px 7px; align-items:baseline; }
    .steam-tag { padding:0; color:#809cae; font-size:10px; line-height:1.5; }
    .steam-tag.tag-primary { color:#aacde2; font-weight:600; }

    .empty { color:var(--sub); padding:24px 0; font-size:13px; }
    .report-details { margin-top:30px; padding-top:14px; border-top:1px solid var(--line); }
    summary { cursor:pointer; color:var(--sub); font-size:11px; }
    .limits { margin-top:10px; color:#809aab; font-size:11px; }
    .sources { display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; font-size:11px; }
    [hidden] { display:none!important; }
    @media(max-width:1120px) { .games { grid-template-columns:repeat(2,minmax(0,1fr)); } .workspace { grid-template-columns:176px minmax(0,1fr); gap:20px; } main { padding-inline:22px; } }

    @media(max-width:480px) { main { padding-inline:14px; } .games { grid-template-columns:minmax(0,1fr); gap:18px; } .amount { font-size:24px; } .copy { padding-inline:13px; } h1 { font-size:22px; } }
    @media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; } }
  </style>

    const hasUpdates=[...seen.values()].some(item=>item.hasUpdate && item.homeCategory!=='alwaysFree');
    newButton.addEventListener('click',()=>{newOnly=!newOnly;renderView();});
    typeButtons.forEach(button=>{const text=button.textContent;button.textContent='';button.append(icon(typeIcons[button.dataset.type]),make('span',text));});
    function renderView() {
      if(activePreview)activePreview.stop();
      const viewingFree=selectedType==='free';
      const viewType=viewingFree?selectedFreeType:selectedType;
      const showNewOnly=newOnly && viewType==='all';
      newButton.hidden=viewType!=='all' || !hasUpdates;
      newButton.setAttribute('aria-pressed',String(showNewOnly));
      byId('free-scope').hidden=!viewingFree;
      freeButtons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.freeType===selectedFreeType)));
      let count=0;facetCounts=new Map();
      panels.forEach((panel,index)=>{
        const inGenre=selectedGenre<0 || selectedGenre===index;
        const candidates=panel.items.filter(item=>
          (viewType==='all' ? item.homeCategory!=='alwaysFree' : item.categories.has(viewType)) &&
          (selectedGenre!==-2 || item.sexual) &&
          (selectedGenre!==coOpGenre || item.coOp) &&
          (!showNewOnly || item.hasUpdate) &&
          (!koreanOnly || item.korean===true)
        );
        const limit=data.selectionLimits?.[viewType];
        const ranked=viewType==='deals'?candidates.sort((a,b)=>
          a.saleRemaining-b.saleRemaining || Number(b.curatedCategories.has('deals'))-Number(a.curatedCategories.has('deals'))
        ):candidates;
        if(inGenre)for(const item of ranked)for(const key of item.tagKeys)facetCounts.set(key,(facetCounts.get(key)||0)+1);
        const filtered=ranked.filter(item=>[...selectedTags].every(key=>item.tagKeys.has(key)));
        const matches=new Set(Number.isInteger(limit)&&limit>=0?filtered.slice(0,limit):filtered);
        panel.items.forEach(item=>{
          item.row.hidden=!matches.has(item);
        });
        const precedingRows=new Map();
        for(const item of matches) {
          const target=panel.buckets[viewType==='all'?item.homeCategory:viewType].list;
          const preceding=precedingRows.get(target);
          const next=preceding?preceding.nextElementSibling:target.firstElementChild;
          if(next!==item.row)target.insertBefore(item.row,next);
          precedingRows.set(target,item.row);
        }
        const visible=matches.size;
        let visibleBuckets=0;
        Object.values(panel.buckets).forEach(bucket=>{
          const n=[...bucket.list.children].filter(row=>!row.hidden).length;
          bucket.container.hidden=n===0;bucket.counter.textContent=`${n}개`;
          if(n)visibleBuckets++;
        });
        panel.columns.dataset.mode=visibleBuckets>1?'split':'single';
        panel.section.hidden=!inGenre || visible===0;
        const heading=panel.section.querySelector('h2');
        if(heading) heading.hidden=selectedGenre!==-1 && selectedGenre!==coOpGenre;
        if(inGenre) count+=visible;
      });
      const name=selectedGenre===-1?'전체 장르':selectedGenre===-2?'성인 요소':selectedGenre===coOpGenre?'협동':panels[selectedGenre].name;
      const viewName=selectedGenre===-2?name:(genreLabels[name]?.[0] || name);byId('view-title').title=name;
      byId('view-title').textContent=viewType==='all'?viewName:`${viewName} · ${labels[viewType]}`;
      byId('view-count').textContent=`${count}개 게임`;
      typeButtons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.type===selectedType)));
      for(const {key,node} of cardTagButtons)node.setAttribute('aria-pressed',String(selectedTags.has(key)));
      for(const button of koreanButtons)button.setAttribute('aria-pressed',String(koreanOnly));
      renderTagOptions();renderActiveFilters();
      const empty=byId('empty-state'); empty.hidden=count!==0;
      if(!count) {
        const messages=panels.filter((_,index)=>selectedGenre<0 || selectedGenre===index).map(panel=>panel.emptyMessages[viewType] || (viewType==='all' ? Object.values(panel.emptyMessages).join(' ') : '')).join(' ');
        const incomplete=/실패|불가|제한|미기재/.test(messages);
        if(koreanOnly) empty.textContent='현재 조건에 맞는 한국어 지원 게임이 없습니다.';
        else if(selectedTags.size) empty.textContent='선택한 태그를 모두 포함한 게임이 없습니다.';
        else if(incomplete) empty.textContent=viewType==='free'?'무료 배포 정보를 확인하지 못했습니다.':'이 조건의 정보를 확인하지 못했습니다.';
        else if(viewType==='free') empty.textContent='현재 확인된 무료 배포가 없습니다.';
        else if(viewType==='alwaysFree') empty.textContent='현재 이 목록에 상시 무료 게임이 없습니다.';
        else if(showNewOnly) empty.textContent='현재 조건에 맞는 NEW 게임이 없습니다.';
        else if(selectedGenre===coOpGenre) empty.textContent='현재 목록에 협동 지원이 확인된 게임이 없습니다.';
        else empty.textContent='조건에 맞는 게임이 없습니다.';
      }
    }
    typeButtons.forEach(button=>button.addEventListener('click',()=>{selectedType=button.dataset.type; renderView();}));
    freeButtons.forEach(button=>button.addEventListener('click',()=>{selectedFreeType=button.dataset.freeType; renderView();}));
    if (grouped && panels.length) {
      const tabs=[];
      const genres=panels.map((panel,index)=>({name:panel.name,index})).filter(entry=>entry.name!=='협동');
      const entries=[{name:'전체',index:-1},...genres,{name:'협동',index:coOpGenre},...(data.includeMature?[{name:'성인 요소',index:-2}]:[])];
      byId('genre-tabs').hidden=false;
      byId('sections').setAttribute('role','tabpanel');
      function activate(index) {
        tabs.forEach((tab,i)=>{tab.setAttribute('aria-selected',String(i===index)); tab.tabIndex=i===index?0:-1;});
        selectedGenre=entries[index].index;
        byId('sections').setAttribute('aria-labelledby',tabs[index].id);
        renderView();
      }
      entries.forEach((entry,index)=>{
        const [shortName,iconName]=genreLabels[entry.name] || [entry.name,'grid'];
        const tab=make('button','','genre-tab'); tab.type='button'; tab.id=`genre-tab-${index}`;
        tab.append(icon(iconName),make('span',shortName,'tab-label'));
        tab.title=entry.name; tab.setAttribute('aria-label',entry.name);
        tab.setAttribute('role','tab'); tab.setAttribute('aria-controls','sections');
        tab.addEventListener('click',()=>{activate(index);if(typeof innerWidth==='number'&&innerWidth<=760)setFiltersOpen(false);});
        tab.addEventListener('keydown',event=>{
          if(event.ctrlKey || event.metaKey || event.altKey) return;
          let next=index;
          if(event.key==='ArrowDown'||event.key==='ArrowRight') next=(index+1)%tabs.length;
          else if(event.key==='ArrowUp'||event.key==='ArrowLeft') next=(index+tabs.length-1)%tabs.length;
          else if(event.key==='Home') next=0;
          else if(event.key==='End') next=tabs.length-1;
          else return;
          event.preventDefault(); activate(next); tabs[next].focus(); tabs[next].scrollIntoView?.({block:'nearest',inline:'nearest'});
        });
        tabs.push(tab); byId('genre-tabs').append(tab);
      });
      activate(0);
    } else renderView();
    const comparison = data.comparedAsOf ? ` · 비교 기준 ${data.comparedAsOf} KST` : '';
    byId('limits').textContent=`대한민국 · KRW · 성적 콘텐츠 태그 게임 ${data.includeMature?'포함':'제외'}${comparison}\n\n${data.limits || ''}`;
    data.sources.forEach(source=>byId('sources').append(link(source.label,source.url)));
    imageStatus();
  })();
  </script>
</body>
</html>
